      diambil — catatan ini dibiarkan sbg riwayat keputusan, bukan petunjuk yg masih berlaku.
  - id: INV-SYSCONST-COL
    prioritas: "Kemungkinan besar sudah teratasi (belum di-cross-check ulang eksplisit 2026-08-22)"
    isi: "Nama kolom sys_constant & sys_sequence aktual -- StockPostingService v1 TIDAK memakai sys_constant/sys_sequence sama sekali (nomor dokumen pakai pola manual MAX+1 spt modul lain, lihat StockDocumentService::nextDocNo()), jadi item ini tidak menghalangi Stock In. Masih relevan kalau nanti INV_BACKDATE_DAYS/INV_ADJ_LIMIT_L1/L2 mau dibaca dari sys_constant sungguhan, bukan hardcode di flow_config_step."
  - id: INV-WAREHOUSE-SEED
    prioritas: "RESOLVED — gudang riil sudah ada (WH-RAW-01/WH-FG-01/WH-MIX-01/WH-SCP-01), dipakai langsung di Stock In v1"
    isi: "Daftar gudang & lokasi riil (m_warehouse, m_wh_loc) sudah final dari Master Warehouse (2026-08-21). Catatan: belum ada warehouse_type khusus SFG -- Stock In SFG demo pakai WH-MIX-01 (Transit & Buffer) sbg lokasi WIP, lihat SIDEBAR_MENU_STANDARD.md #6 poin 3."
  - id: INV-COSTING-METHOD-SEED
    prioritas: SEDANG
    isi: "costing_method per item belum ditetapkan. Default AVG. Kertas mungkin FIFO (fluktuasi harga + lot jelas), tinta/kimia AVG. Butuh review per kategori bersama Accounting."
  - id: INV-TRANSFER-GUDANG
    prioritas: RENDAH
    isi: "Transfer antar gudang saat ini dilakukan sebagai pasangan Stock Out + Stock In (dua dokumen). Bila frekuensinya tinggi, pertimbangkan dokumen tunggal doc_cat='TRANSFER' di fase 2."
  - id: INV-JURNAL-PERSEDIAAN
