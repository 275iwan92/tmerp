open_items:
  - id: INV-DELTA-CONFIRM-THRESHOLD
    prioritas: "TINGGI (implementasi selesai, sign-off bisnis belum eksplisit dikonfirmasi)"
    isi: >
      [UPDATE 2026-08-22] flow_config_step utk module_code AD/OP SUDAH ter-seed persis
      sesuai usulan: Kepala Gudang (position_id=59) 0-5jt, Manajer Operasional (position_id=6)
      5-25jt, Direksi (position_id=7) >25jt. Dicek langsung ke tm2mst.flow_config_step, bukan
      dugaan. Yang BELUM jelas: apakah angka ini sudah benar-benar disetujui Telma/Jo secara
      formal, atau cuma "usulan default" yang kebetulan sudah dieksekusi duluan — tanyakan
      kalau approval Adjustment/Opname mulai dipakai sungguhan, jangan asumsikan final.
  - id: INV-DELTA-CONFIRM-BACKDATE
    prioritas: SEDANG
    isi: "INV_BACKDATE_DAYS usulan 7 hari. Terlalu ketat menyulitkan gudang, terlalu longgar merusak tutup periode. Butuh angka riil dari praktik lapangan. Belum dicek apakah sudah ada di sys_constant."
  - id: INV-FLOW-POSITION
    prioritas: "RESOLVED 2026-08-22"
    isi: >
      position_id riil SUDAH ADA & terpakai di flow_config_step: Kepala Gudang=59,
      Manajer Operasional=6, Direksi=7 (dicek langsung ke org_position + flow_config_step,
      bukan diasumsikan). Blocker ini SUDAH TERATASI, kemungkinan besar diselesaikan
      bersamaan sesi 2026-08-21 saat modul Inventory & Procurement lain digarap, dokumen ini
      saja yang telat diupdate. StockPostingService/Stock In v1 tidak terhambat oleh item ini.
  - id: INV-DATA-CLEANUP
    prioritas: "Kemungkinan besar sudah dilakukan (belum di-cross-check ulang eksplisit 2026-08-22)"
    isi: >
      Sebelum unique index dipasang, data legacy WAJIB dibersihkan:
      (a) rm_stock.doc_no duplikat — 26BB00005 x6, 26OU00014 x5;
      (b) rm_stock_d.location_id NULL/0 — banyak baris, penyebab saldo yatim di v_rm_onhand;
      (c) rm_stockcard duplikat reference_detail_id 62/63/64;
      (d) rm_stockcard dgn qty_eb negatif (doc_id 28,29,30,42) — hasil bug trigger, perlu rebuild.
      Skrip pratinjau ada di INV_TIER_3 §5. Sesi 2026-08-21 (memory project_inventory_module_status)
      mencatat "6 duplikat rm_stockcard dari bug double-posting dihapus" & "null location_id
      dibackfill ke UNKNOWN-LEGACY" -- tampaknya sudah ditangani, tapi item (a)/(d) belum
      dikonfirmasi eksplisit tuntas. Cross-check ulang sebelum memasang UNIQUE index kalau
      belum yakin.
  - id: INV-MIGRASI-TMINV-KE-TM2INV
    prioritas: "RESOLVED (data sudah ada di tm2inv, keputusan sudah diambil)"
    isi: >
      Sudah diputuskan & dieksekusi sesi 2026-08-21: data legacy DIIMPOR (bukan mulai bersih)
      ke tm2inv, dengan cleanup (duplikat doc_no di-suffix -DUPn, dst — lihat
