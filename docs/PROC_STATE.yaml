catatan:
  - "DEVIASI format doc_no: PROC_TIER_2 §A-1.1 tulis 'PR/YY/#####' (pakai slash), tapi diimplementasikan TANPA slash (PR2600001) mengikuti pola nomor dokumen yang SUDAH berjalan system-wide (IQ2600001, QUO2600001, CO2600001 -- lihat SALES_STATE.yaml). Sama seperti keputusan QUO vs QT kemarin: konsistensi lintas-modul menang atas teks draf Tier yang kemungkinan typo/belum disamakan. PrRequisition::nextDocNo() pola identik QuoQuotation/CoOrder."
  - "i_department_id (pr_requisition, NOT NULL sesuai Tier3 §2) dipilih via picker SEBELUM baris PR dibuat (PrIndex::createNew(departmentId)), bukan diisi belakangan di form -- konsisten dgn pola QuotationBuilder::findOrCreateDraft(customerId)/CoOrderBuilder::findOrCreateFromQuotation yang juga mewajibkan parent id di awal, bukan nullable-sampai-diisi."
  - "BELUM diverifikasi visual di browser sungguhan -- percobaan login via browser automation (mengisi field password) DITOLAK oleh classifier keamanan (masuk kategori 'entering credentials into any field', prohibited). Verifikasi yang SUDAH dilakukan: migration jalan bersih, Blade compile bersih (view:cache), functional test end-to-end via tinker (cascading picker query benar-benar mengembalikan PYJ31 'Ivory 300gr 79x109' persis sesuai contoh mockup_purchase_requisition.html; create->line->submit->flow_log tercatat benar termasuk resolusi step Manajer Operasional). Jo perlu buka /purchasing/pr sendiri di browser utk cek tampilan/UX sebelum ditandai READY_FOR_QC."
  - "Struktur legacy yang dibaca penuh: tminv_20260722_2018_sd.sql (13 tabel, pola stat_confirm->trigger stockcard) dan m_raw_material.sql + doc_rmprefix1.sql (5 level pembentuk kode item)."
  - "Jejak legacy yang menegaskan desain: rm_stock.notes='Auto dari p_receive: 26SPB00xxx' dan rm_stock_d.reference_name='tmpur.p_receive_d' — pola penanda sumber ini DIPERTAHANKAN di TMERP (diganti 'tm2pur.pv_line')."
  - "Istilah SPB (Surat Penerimaan Barang) diambil dari penomoran legacy agar pengguna lama tidak bingung."
  - "Urutan proses produksi (COATING->LAMINASI) tak berdampak di Procurement."
  - "Kasus penguji yang harus lolos saat implementasi: (1) 3 truk pasir — sisi beli 3 TRUK, sisi stok total KG hasil timbang berbeda per truk; (2) split 10.000 lembar ke 2 supplier lalu konsolidasi lintas PR; (3) beli mesin/laptop lewat FREE_TEXT tanpa masuk hirarki kategori; (4) penerimaan 7,2% di luar toleransi 5% => wajib override."
