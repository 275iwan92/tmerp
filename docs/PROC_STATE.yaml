modul: "04_procurement"
db: tm2pur
fase: "1 — PR / PQ / PO / PV / PRT + Purchase Invoice (tanpa posting GL)"
status_umum: >
  SPEC SELESAI (2026-08-20). IMPLEMENTASI: spine PR->PR Approval->PO->PV hidup penuh
  2026-08-20/21 (di luar urutan resmi yg diminta Jo, PV ikut dikerjakan krn dokumennya
  sudah diberikan). Fondasi dulu:
  Legacy doc_rmprefix1..5 (555 baris) & m_raw_material (5893 baris) di-import APA ADANYA dari
  dump asli user (database/legacy/*.sql) -- FK ke m_uom lama DIHAPUS (tabel tak pernah ada di
  TMERP, diganti logical ref ke uom_unit). Flow Engine generik (flow_config/flow_config_step/
  flow_position_acting/flow_log, TIER_1/2/3_FLOW_ENGINE.md) DIBANGUN di tm2mst dan dipakai PR
  sejak awal (bukan approval ad-hoc). PR Entry (List + Form, App\Models\Pur\*, route
  /purchasing/pr, module gate PROC) hidup: header, item picker 5-level (kategori->jenis->
  gramatur->ukuran->merk lalu daftar m_raw_material cocok), baris MASTER_ITEM/FREE_TEXT,
  submit -> FlowEngineService -> flow_log. PR Approval Center (route /purchasing/pr-approval)
  JUGA sudah hidup 2026-08-21: antrian per posisi jabatan user login (+ resolusi PLT),
  approve/reject dgn FlowEngineService::approve()/reject() (chaining multi-step: step
  berikutnya yang match otomatis jadi pending baru, atau flow selesai bila tak ada lagi).
  SecUser::currentPositionId() ditambahkan (employee_id -> tm2mst.emp_employee.position_id,
  logical cross-DB) sbg dasar resolusi "posisi user login ini".
  Diverifikasi via migration run + tinker functional test end-to-end: cascading picker query
  benar (PYJ31 Ivory 300gr 79x109 persis contoh mockup), create->line->submit->flow_log benar,
  approve single-step (<50jt langsung final), reject (alasan tercatat), DAN eskalasi
  multi-step (>=50jt: Manajer Operasional approve -> otomatis jadi pending baru di Direksi) --
  semua lolos.
  PO Entry (List + Form, route /purchasing/po) JUGA hidup 2026-08-21: tarik `pr_line_alloc`
  APPROVED lintas-PR ke satu PO per supplier (PoBuilderService, anti-M:N 1 alokasi=1 po_line
  via UNIQUE uq_po_alloc), kelas RAW/INDIRECT/SERVICE otomatis dari doc_rmprefix1.stock_class,
  harga/diskon per baris editable (PQ belum ada jadi harga awal dari PR i_est_price, manual),
  ringkasan pajak (DPP/PPN 11%/PPh23 2% baris SERVICE saja/Net Payable dari sys_constant),
  submit -> FlowEngineService (flow_config PO: step1 Manajer Operasional, step2 Direksi >=100jt,
  sama pola PR). flow_config_step.status_to_reject PO dikoreksi ke REJECTED (bukan DRAFT seperti
  draf awal disalin dari PR) krn status enum PO tak punya REVISION_NEEDED (Tier3 §4 C-1).
  Diverifikasi via tinker: tarik 2 alokasi lintas-PR ke 1 PO, edit harga, hitung pajak, submit
  -> semua benar (DPP 11.5jt -> PPN 1.265jt -> Grand 12.765jt, PPh23=0 krn tak ada baris SERVICE).
  PV (Purchase Receive/SPB) JUGA hidup 2026-08-21, dirombak total oleh DELTA_PROC_PV_MULTIPO.md
  (dokumen user, KEPUTUSAN TERKUNCI, benchmark SAP/Oracle/Odoo/D365): satu SPB boleh menampung
  BANYAK PO dari SATU supplier sekaligus -- referensi PO pindah dari header (dihapus) ke baris
  (pv_line.po_line_id + snapshot c_po_id/c_po_doc_no/c_po_line_no). PENTING: skema fisik yang
  dibangun BUKAN salinan `PATCH_DDL_PV_MULTIPO.sql` dari user -- patch itu mengasumsikan kolom
  snapshot penuh (c_supplier_name, c_department_name, c_coa_code, c_amount_words, dst di
  po_order/po_line) yang TIDAK ADA di skema saya (gaya minimal-FK, PROC_TIER_3 asli), dan
  prasyaratnya (DDL_PROCUREMENT_tm2pur.sql, SEED_PROC_DUMMY.sql) tidak ada di project ini sama
  sekali. Aturan bisnis PV-01..PV-11 DIADOPSI PENUH; kolom fisik dibangun ulang menyesuaikan
  konvensi tm2pur yang sudah berjalan. Fitur: picker 2-langkah supplier->worklist lintas-PO
  (PvBuilderService::supplierWorklist()/openLinesForSupplier(), ala Oracle Find Expected
  Receipts), dual-UOM, QC 2 gerbang, toleransi+override per baris, "+ Tambah Baris dari PO
  Lain", rekalkulasi PER PO yang tersentuh saat POST (PV-08, PvPostingService::recalcPo()
  dipanggil utk SETIAP po_id distinct, bukan asumsi 1 PO). po_line.is_receivable ditambahkan
  (PV-09) -- baris SERVICE otomatis tak pernah muncul di worklist PV.
  KETERBATASAN SADAR: PvPostingService::post() BELUM menulis rm_stock/rm_stock_d -- dump legacy
  tminv_20260722_2018_sd.sql masih belum diberikan user. Status PV->POSTED dan rekalkulasi
  po_line/po_order per-PO (PV-08) tetap benar & teruji; yang tertunda HANYA pergerakan stok
  fisik. Titik sambungnya ditandai TODO eksplisit di kode.
  Diverifikasi tuntas via tinker: (a) 1 SPB dari 1 PO normal -> POST -> PO jadi RECEIVED; (b)
  toleransi terlampaui (8% vs batas 5%) -> POST terblokir -> override -> POST sukses; (c) KASUS
  UTAMA PV-01: 2 PO BERBEDA ditarik ke SATU SPB sekaligus (c_po_count=2), POST merekalkulasi
  KEDUA PO secara independen dgn benar -- semua lolos.
  BELUM diverifikasi visual di browser sungguhan utk SEMUA layar (PR/PR Approval/PO/PV) --
  lihat catatan di bawah.
  PQ, PO Approval, PRT, Purchase Invoice masih 🟡 spec-only/belum diimplementasi.
  Dua struktur legacy dibaca penuh: m_raw_material.sql + doc_rmprefix1.sql (SUDAH diberikan
  user & di-import); tminv_20260722_2018_sd.sql (rm_stock/rm_stock_d/rm_stockcard/sfg_*/fg_*)
  MASIH BELUM diberikan -- sekarang BENAR-BENAR jadi blocker (PV sudah dikerjakan, cuma posting
  stok fisiknya yang tertunda).

keputusan_terkunci:
  A_anti_m2m: "pr_line -> pr_line_alloc -> po_line (1:1, dijaga UNIQUE uq_po_alloc). Konsolidasi di HEADER po_order, bukan di baris."
  B_prefix: "pr_ requisition | pq_ | po_ | pv_ | prt_ return (prt_ karena pr_ sudah terpakai)"
  C_adopsi_legacy_inventory: "rm_stock/rm_stock_d/rm_stockcard + sfg_*/fg_* dipakai apa adanya; PV TIDAK membuat tabel stok baru"
  D_dual_uom_pv: "sisi beli (tutup PO/tagihan) + sisi stok (masuk gudang) INDEPENDEN; conversion_to_stock = nilai awal, boleh ditimpa (kasus 3 truk pasir)"
  E_qc_dua_gerbang: "QC qty + QC kualitas; hanya c_qty_accepted masuk stok; POST diblokir bila ada PENDING"
  F_toleransi: "per item via m_raw_material.tol_purchase (kolom SUDAH ADA), fallback sys_constant RECEIVE_TOLERANCE_PCT=5; di luar batas wajib override+alasan"
  G_pajak_di_sys_constant: "PPN & PPh23 di sys_constant — BUKAN membuat fin_tax_scheme baru (keputusan Jo, membatalkan blocker FIN-TAX-SCHEME untuk modul ini)"
  H_pajak_per_baris: "PPN atas seluruh DPP; PPh23 hanya baris SERVICE; diskon di level baris"
  I_dua_jalur_item: "MASTER_ITEM (picker 5 level) atau FREE_TEXT (mesin/laptop/jasa tak terdaftar — tidak dipaksa masuk hirarki kategori)"
  J_beban_overhead: "diturunkan dari klasifikasi akun COA, bukan picker terpisah"
  K_purchase_invoice: "pakai fin_invoice (tm2acc) yang sudah polymorphic AR+AP; TIDAK membuat tabel pi_*; SUPPLIER_DP dari PO, SUPPLIER_BILL dari PV; alokasi via fin_dp_allocation"
  L_fin_invoice_line: "DELTA WAJIB — fin_invoice header-only, perlu rincian baris untuk Sales MAUPUN Purchase"
  M_costing_method: "AVG/FIFO/LIFO PER ITEM; FIFO/LIFO butuh inv_stock_layer; stockcard tetap ringkasan"
  N_snapshot_kurs: "i_fx_rate dibekukan saat PO APPROVED; currency INDEPENDEN dari po_type (supplier lokal boleh USD)"
  O_po_kontan: "i_procure_type='CASH' — auto-generate PO(APPROVED)+PV(POSTED); approval jadi NOTIFY_ONLY"
  P_layar_terpisah: "PO Entry dan PO Approval dua layar berbeda, sama-sama detail; Approve/Reject tak pernah di layar entry"
  Q_sisi_visibilitas: "layar gudang TIDAK query kolom harga sama sekali; nilai tetap tersimpan di pv_line"
  R_revise: "PR & PO copy-record; PV & PRT tanpa REVISE (fisik). RECALC tidak relevan."
  S_import_defer: "po_import_doc struktur siap tapi INACTIVE; BM/PPN impor/PPh22 tidak dihitung (jarang impor)"
  T_cost_tracking: "co_line_id menetes PR->alloc->PO->PV untuk biaya material riil per Customer Order"
  W_pv_multi_po_supplier_driven: "DELTA_PROC_PV_MULTIPO.md, PV-01..PV-11 (2026-08-21) -- 1 SPB : N PO (satu supplier), referensi PO di BARIS bukan header, supplier+gudang jadi kunci dokumen (hard block), mata uang harus sama (hard block), termin/tgl kirim boleh beda (warning saja), 1 nomor SPB utk seluruh dokumen, SJ boleh >1 (header+per-baris), rekalkulasi PER PO yang tersentuh saat POST (bukan asumsi 1 PO), baris SERVICE tak pernah masuk PV (is_receivable=0, ditutup di layar PO). Skema fisik dibangun ULANG dari draf patch user krn patch itu asumsikan kolom snapshot & prasyarat DDL yang tak ada di project ini -- lihat status_umum utk detail deviasi."

