open_items:
  - id: INV-DELTA-CONFIRM-THRESHOLD
    prioritas: "TINGGI (implementasi selesai, sign-off bisnis belum eksplisit dikonfirmasi)"
    isi: >
      [UPDATE 2026-08-22] flow_config_step utk module_code AD/OP SUDAH ter-seed persis
      sesuai usulan: Kepala Gudang (position_id=59) 0-5jt, Manajer Operasional (position_id=6)
      5-25jt, Direksi (position_id=7) >25jt. Dicek langsung ke tm2mst.flow_config_step, bukan
      dugaan. Yang BELUM jelas: apakah angka ini sudah benar-benar disetujui Telma/Jo secara
      formal, atau cuma "usulan default" yang kebetulan sudah dieksekusi duluan — tanyakan
      kalau approval Adjustment/Opname mulai dipakai sungguhan, jangan asumsikan final.
  - id: INV-DELTA-CONFIRM-BACKDATE
    prioritas: SEDANG
    isi: "INV_BACKDATE_DAYS usulan 7 hari. Terlalu ketat menyulitkan gudang, terlalu longgar merusak tutup periode. Butuh angka riil dari praktik lapangan. Belum dicek apakah sudah ada di sys_constant."
  - id: INV-FLOW-POSITION
    prioritas: "RESOLVED 2026-08-22"
    isi: >
      position_id riil SUDAH ADA & terpakai di flow_config_step: Kepala Gudang=59,
      Manajer Operasional=6, Direksi=7 (dicek langsung ke org_position + flow_config_step,
      bukan diasumsikan). Blocker ini SUDAH TERATASI, kemungkinan besar diselesaikan
      bersamaan sesi 2026-08-21 saat modul Inventory & Procurement lain digarap, dokumen ini
      saja yang telat diupdate. StockPostingService/Stock In v1 tidak terhambat oleh item ini.
  - id: INV-DATA-CLEANUP
    prioritas: "Kemungkinan besar sudah dilakukan (belum di-cross-check ulang eksplisit 2026-08-22)"
    isi: >
      Sebelum unique index dipasang, data legacy WAJIB dibersihkan:
      (a) rm_stock.doc_no duplikat — 26BB00005 x6, 26OU00014 x5;
      (b) rm_stock_d.location_id NULL/0 — banyak baris, penyebab saldo yatim di v_rm_onhand;
      (c) rm_stockcard duplikat reference_detail_id 62/63/64;
      (d) rm_stockcard dgn qty_eb negatif (doc_id 28,29,30,42) — hasil bug trigger, perlu rebuild.
      Skrip pratinjau ada di INV_TIER_3 §5. Sesi 2026-08-21 (memory project_inventory_module_status)
      mencatat "6 duplikat rm_stockcard dari bug double-posting dihapus" & "null location_id
      dibackfill ke UNKNOWN-LEGACY" -- tampaknya sudah ditangani, tapi item (a)/(d) belum
      dikonfirmasi eksplisit tuntas. Cross-check ulang sebelum memasang UNIQUE index kalau
      belum yakin.
  - id: INV-MIGRASI-TMINV-KE-TM2INV
    prioritas: "RESOLVED (data sudah ada di tm2inv, keputusan sudah diambil)"
    isi: >
      Sudah diputuskan & dieksekusi sesi 2026-08-21: data legacy DIIMPOR (bukan mulai bersih)
      ke tm2inv, dengan cleanup (duplikat doc_no di-suffix -DUPn, dst — lihat
      project_inventory_module_status). Rekomendasi "mulai bersih" di paragraf lama TIDAK
      diambil — catatan ini dibiarkan sbg riwayat keputusan, bukan petunjuk yg masih berlaku.
  - id: INV-SYSCONST-COL
    prioritas: "Kemungkinan besar sudah teratasi (belum di-cross-check ulang eksplisit 2026-08-22)"
    isi: "Nama kolom sys_constant & sys_sequence aktual -- StockPostingService v1 TIDAK memakai sys_constant/sys_sequence sama sekali (nomor dokumen pakai pola manual MAX+1 spt modul lain, lihat StockDocumentService::nextDocNo()), jadi item ini tidak menghalangi Stock In. Masih relevan kalau nanti INV_BACKDATE_DAYS/INV_ADJ_LIMIT_L1/L2 mau dibaca dari sys_constant sungguhan, bukan hardcode di flow_config_step."
  - id: INV-WAREHOUSE-SEED
    prioritas: "RESOLVED — gudang riil sudah ada (WH-RAW-01/WH-FG-01/WH-MIX-01/WH-SCP-01), dipakai langsung di Stock In v1"
    isi: "Daftar gudang & lokasi riil (m_warehouse, m_wh_loc) sudah final dari Master Warehouse (2026-08-21). Catatan: belum ada warehouse_type khusus SFG -- Stock In SFG demo pakai WH-MIX-01 (Transit & Buffer) sbg lokasi WIP, lihat sidebarmenustandard.md #6 poin 3."
  - id: INV-COSTING-METHOD-SEED
    prioritas: SEDANG
    isi: "costing_method per item belum ditetapkan. Default AVG. Kertas mungkin FIFO (fluktuasi harga + lot jelas), tinta/kimia AVG. Butuh review per kategori bersama Accounting."
  - id: INV-TRANSFER-GUDANG
    prioritas: RENDAH
    isi: "Transfer antar gudang saat ini dilakukan sebagai pasangan Stock Out + Stock In (dua dokumen). Bila frekuensinya tinggi, pertimbangkan dokumen tunggal doc_cat='TRANSFER' di fase 2."
  - id: INV-JURNAL-PERSEDIAAN
    prioritas: RENDAH
    isi: "Kolom value_* di *_stockcard sudah menyiapkan angka untuk jurnal persediaan, tapi posting ke GL di luar scope fase ini. Sinkronkan dengan FIN_STATE saat Finance masuk scope."
  - id: INV-SFG-FG-DEPTH
    prioritas: SEDANG
    isi: >
      Tier 1-4 ditulis dengan RM sebagai contoh utama; SFG dan FG mengikuti aturan yang sama.
      Yang belum digali: apakah output antar-proses (mis. setelah PLONG) benar-benar perlu
      dicatat sebagai movement SFG, atau cukup dilacak di Production tanpa menyentuh ledger stok.
      Mencatat semuanya berarti belasan dokumen SFG per WO. Butuh keputusan bersama Production.
  - id: INV-PERIODSERVICE-DORMANT
    prioritas: TINGGI
    isi: >
      2026-08-27: PeriodService::assertOpen() TERNYATA belum pernah dipanggil di posting
      manapun sejak dibuat (dorman) — StockPostingService::postDocument() kemungkinan
      mengecek period_id OPEN secara inline (lihat inventory_tier2.md langkah 2), bukan lewat
      method terpusat. Ini naik prioritas jadi TINGGI karena financeaccounting_delta_period_close.md
      (engine periode GL, baru ditulis) MEWAJIBKAN inv_period ditegakkan sungguhan sebagai
      prasyarat gate lintas-modul — GL period tidak bisa CLOSED (ireversibel) selama inv_period
      bulan yang sama belum CLOSED. Kalau assertOpen() tetap dorman, gate itu jadi tidak
      berarti apa-apa. Verifikasi StockPostingService dulu sebelum refactor.
  - id: INV-FIN-STATUS-VOCAB-MISMATCH
    prioritas: SEDANG
    isi: >
      2026-08-27: inv_period pakai status OPEN/CLOSING/CLOSED (INV-03), sedangkan fin_period
      (baru, financeaccounting_delta_period_close.md) pakai OPEN/ON_HOLD/CLOSED (pola D365).
      "CLOSING" vs "ON_HOLD" belum tentu semantiknya sama — perlu diselaraskan sebelum
      FinPeriodGuard::assertCanClose() membaca status inv_period lintas-DB, supaya perbandingan
      statusnya benar (mis. apakah inv_period='CLOSING' dianggap "belum CLOSED" atau setara
      ON_HOLD Finance). Putuskan eksplisit, jangan asumsikan string match kebetulan cocok.

catatan_untuk_sesi_berikutnya: >
  Mockup memakai 'ADJ/26/00023' untuk dokumen berjenis OPNAME. Sesuai INV-09 yang benar adalah
  'OPN/26/#####' untuk opname dan 'ADJ/26/#####' untuk adjustment. Spec Tier yang berlaku;
  mockup akan disesuaikan saat implementasi.
