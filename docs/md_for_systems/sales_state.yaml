# ═══════════════════════════════════════════════════════════════════
# sales_state.yaml — PROGRESS MODUL 01 SALES (Inquiry → Imposition →
# Costing → Nota → Quotation → Customer Order)
# Pasangan: inquiryproduct_flow.md (§0 doc itu sudah menyebut file
# ini sebagai pasangannya sejak 2026-08-14, baru dibuat sekarang 2026-08-20).
# Update tiap ada keputusan/task baru. Baca DULU tiap sesi Sales.
# ═══════════════════════════════════════════════════════════════════
modul: "01_sales"
db: tm2sdi (+ tm2mst utk master, FK logis lintas-DB)
fase: "Spine order-to-cash Sales LENGKAP sampai CO — Inquiry, Imposition, Costing, Nota, Quotation, Customer Order semua live & teruji 2026-08-20"
status_umum: >
  Rantai penuh Inquiry -> Imposition -> Costing -> Nota -> Quotation -> Customer Order
  hidup & teruji end-to-end (2026-08-19/20). Imposition Engine (iqp_layout + m_plano_size)
  auto-fill ke Costing saat confirm. Nota Inquiry (mode warna/hemat-tinta) & Quotation resmi
  (print, palet navy/accent dikoreksi dari draf hijau) keduanya respect Sisi A/B (harga
  disembunyikan kalau costing belum published_flag=1). Quotation DIROMBAK TOTAL 2026-08-20
  dari desain draf-pertama (1:1 per inquiry) jadi many-to-one per customer (quo_quotation +
  quo_quotation_item) -- BARU SETELAH pekerjaan itu selesai, ditemukan bahwa
  inquiryproduct_tier1.md §3.4 & inquiryproduct_tier2.md §3.4 SUDAH mengunci desain many-to-one
  ini dari awal (independen, tidak dibaca dulu sebelum membangun) -- hasil akhirnya cocok di
  struktur inti tapi ada beberapa deviasi nyata, lihat deviasi_dari_tier1_locked di bawah.
  Customer Order (co_order) dibangun dari nol 2026-08-20 -- SATU-SATUNYA sub-modul session ini
  yang TIDAK ADA di TIER_1/TIER_2 sama sekali sampai section relasi (§3.4), jadi desain co_order
  murni dari mockup_co_entry.html + keputusan langsung user.

keputusan_terkunci:
  A: "1 Quotation = N inquiry (customer sama) + N baris jasa/tooling bebas -- BUKAN 1:1 per inquiry (keputusan user 2026-08-20, cocok dgn TIER_1 §3.4.1 many-to-one)"
  B: "1 CO = 1 Quotation (co_order.quotation_id UNIQUE) -- cocok persis TIER_1 §3.4.2 baris 'Quotation -> CO : 1:1'"
  C: "Item CO = snapshot quo_quotation_item, TERKUNCI (kecuali due_date) -- cocok TIER_1 §3.4.3 poin 3 'qty/harga/diskon item = snapshot, fix'"
  D: "Tooling di-split per jenis (PISAU+MATRAS=die, PLATE, FILM) jadi BARIS TERPISAH di quotation/CO, bukan 1 baris gabung -- sesuai mockup_sales_quotation_letter_print.html"
  E: "Nomor dokumen: IQ+YY+NNNNN (inquiry), QUO+YY+NNNNN (quotation), CO+YY+NNNNN (customer order) -- QUO dikonfirmasi user 2026-08-20 sbg prefix resmi, TIER_1 §2.4 sudah dikoreksi"
  F: "Quotation resmi (print) HANYA terbit nomor kalau costing published_flag=1 (Sisi A/B, CLAUDE.md §4) -- lihat deviasi #2, TIER_2 §3.4 bilang tombol convert 'selalu aktif' walau belum published"
  G: "PPh 23 (jasa) = 2% dari nilai baris SERVICE, dipotong di level CO (asumsi rate standar Indonesia, belum ada konfirmasi user/dokumen resmi)"
  H: "Shipment Location (CO) pakai App\\Livewire\\AddressPicker existing, bukan komponen baru -- 5 level kelurahan..negara, fallback otomatis ke level lebih kasar kalau data sedetail itu tak ada"

deviasi_dari_tier1_locked:
  - "#1 PREFIX QUOTATION -- RESOLVED 2026-08-20: user memutuskan pakai 'QUO' (kode & mockup menang), inquiryproduct_tier1.md §2.4 sudah dikoreksi (semula draf sebut 'QT'). Tidak ada lagi konflik."
  - "#2 GATE PUBLISH vs TOMBOL SELALU AKTIF: inquiryproduct_tier2.md §3.4 pseudo-code convert_to_quotation() bilang tombol 'selalu aktif; bila harga belum published, quotation tetap bisa dibuat sbg draft, baris harga menunggu publish'. Yang dibangun LEBIH KETAT: App\\Services\\Sales\\QuotationBuilder::addInquiry() me-return null (tak menambah apapun) kalau costing belum published_flag=1 -- alasan saat itu: TIDAK mau baris quotation dgn harga kosong/0 yang bisa membingungkan. Bisa direvisi supaya cocok dgn desain terkunci (izinkan baris draft tanpa harga, isi otomatis pas costing publish) kalau user mau."
  - "#3 GUARD LOKASI KIRIM: TIER_1 §3.4.3 poin 6 'inquiry hanya bisa masuk quotation bila customer & lokasi kirim SAMA'. Yang dibangun cuma guard CUSTOMER (App\\Services\\Sales\\QuotationBuilder / quotation.entry availableInquiries() filter customer_id saja) -- TIDAK ada guard lokasi kirim, karena iqp_inquiry belum punya field lokasi kirim sama sekali (lokasi kirim baru muncul di co_order.ship_area_id/level, level CO bukan level inquiry/quotation). Kalau guard ini mau ditegakkan, perlu tambah field lokasi kirim di iqp_inquiry dulu."
  - "#4 TEMPAT TOMBOL 'TAMBAHKAN KE QUOTATION': TIER_1 F21 & TIER_2 §3.4 menaruh tombol convert di 'tiap layar inquiry' (new/recalc/revise). Yang dibangun menaruhnya di Costing (setelah published), bukan di layar Inquiry -- alasan: baris quotation butuh harga (price_per_pcs) yang cuma ada di costing published, jadi menaruh tombol di Inquiry (sebelum costing ada) akan sering gagal/kosong."
  - "#5 TOOLING SEBAGAI BARIS TERPISAH per jenis: tidak disebut sama sekali di TIER_1/TIER_2 relasi model (§3.4.2 cuma bilang '1 inquiry : 1 quotation-line') -- yang dibangun 1 inquiry bisa menyumbang 2-4 baris (1 produk + sampai 3 tooling: die/plate/film) kalau ada tooling is_new_charge. Ini nurut mockup_sales_quotation_letter_print.html yang eksplisit menampilkan baris terpisah, TIER_1/2 belum diupdate mengikuti pola ini."

