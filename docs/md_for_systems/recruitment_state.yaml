simulasi_portal_sementara:
  keputusan: "Atas instruksi user 2026-08-29: portal kandidat (P1-P4) DIBUAT DULU sbg simulasi/preview DI DALAM repo tmerp ini (Laravel/Livewire, host yang sama dgn internal), supaya user bisa lihat & review tampilannya duluan."
  status: "LIVE 2026-08-29 — dibangun sbg 1 layar wizard resources/views/pages/recruitment/portal.blade.php (route hrm.recruitment.portal, menu HRM_RCR_PORTAL label 'Portal Candidate' di grup Recruitment). 'Login' cuma via No. KTP (tanpa password/OTP sungguhan, sesuai instruksi 'jangan investasi berlebihan di sisi auth'). Diuji end-to-end via Livewire::test() (lihat implementasi_2026_08_29)."
  sifat: "SEMENTARA/prototipe, BUKAN perubahan arsitektur final. keputusan_terkunci.dua_host_arsitektur (portal = host terpisah, Flutter, PULL-sync) TETAP BERLAKU sbg desain akhir — simulasi ini cuma jalan pintas visual di host internal."
  rencana_migrasi: "Setelah user setuju tampilannya, hasil simulasi (struktur layar P1-P4, komponen, alur) di-copy/port ke stack final (Flutter, host terpisah, Firebase Plan A atau tm2crp Plan B) — BUKAN dipakai langsung sbg portal produksi di host internal."
  implikasi_teknis_saat_digarap:
    - "Taruh di route/namespace yang jelas ditandai sementara (mis. prefix /recruitment-portal-preview atau folder resources/views/recruitment-portal-sim/) supaya gampang dibedakan dari layar internal HRM (L1-L9) & gampang dicabut/dipindah nanti."
    - "Boleh pakai tabel tm2hrr yang sama (cnd_*/app_*) langsung tanpa lapisan sync — karena ini masih 1 host, TAPI ingat ini menyimpang dari desain final (portal beneran tidak pernah akses tm2hrr langsung, cuma lewat PULL sync worker). Jangan biarkan asumsi ini menyelinap ke kode internal L1-L9."
    - "Jangan investasi berlebihan di sisi auth/security portal simulasi ini (mis. tidak perlu OTP/verifikasi WhatsApp beneran) — cukup untuk keperluan review visual, karena akan dibuang/diganti total saat pindah host."
  percobaan_tm2crp_2026_08_29: "Sempat dicoba pindah portal simulasi ke DB terpisah tm2crp (Plan B beneran, docs/recruitment_tier3.md SECTION 3 -- model Crp*, migration crp schema, config/database.php koneksi tm2crp, RecruitmentSyncService PULL worker) atas instruksi user 'untuk portal simulasi gunakan mariaDB'. DIBATALKAN user di sesi yang sama ('pakai mysql dulu saja, tm2crp nanti kita pindahkan') -- semua kode itu dihapus lagi. STATUS SUDAH BERUBAH 2026-08-30 -- lihat implementasi_2026_08_30_plan_ab_local, user minta dibangun lagi (kali ini permanen, bukan dibatalkan)."

implementasi_2026_08_30_plan_ab_local:
  keputusan: "User eksplisit minta Plan A (Firebase) + Plan B (tm2crp MariaDB) DIBANGUN SUNGGUHAN & BISA DI-SWITCH, keduanya lokal (MariaDB Server + Firebase Local Emulator Suite di-install di mesin dev, BUKAN VPS/project cloud asli -- dikonfirmasi via AskUserQuestion sebelum eksekusi). Ini keputusan yang MEMBATALKAN pembatalan sesi 2026-08-29 (percobaan_tm2crp_2026_08_29) -- kali ini permanen sampai ada instruksi lain."
  yang_diinstall:
    - "MariaDB Server 12.3 (winget MariaDB.Server) -- port 3307 (3306 dipakai MySQL tm2* existing), service Windows 'MariaDB'."
    - "Database tm2crp + user tm2crp_user (kredensial di .env DB_CRP_*, TERPISAH dari kredensial MySQL tm2user -- isolasi portal<->internal tetap masuk akal meski 1 mesin)."
    - "Firebase CLI (npm -g firebase-tools) + Microsoft OpenJDK 21 portable (zip, BUKAN installer MSI -- installer MSI macet nunggu UAC elevation yang tak bisa dijawab di sesi non-interaktif Claude Code, di-kill & diganti unduhan zip portable ke C:\\Users\\iwanp\\.local\\jdk)."
    - "kreait/firebase-php (composer) -- Admin SDK, diarahkan ke Firestore Local Emulator via env FIRESTORE_EMULATOR_HOST, BUKAN project Firebase cloud asli (project id 'demo-tmerp-crp', tak perlu billing/service-account)."
  delta_vs_tier3_asli: "docs/recruitment_delta_plan_ab_local.md -- ringkas: skema crp_submission Tier3 (versi ringkas: national_id/name/birth_date/address doang) DIPERLUAS mirror ~50 kolom skalar cnd_candidate + 5 kolom JSON utk seksi berulang (family_members/education/education_nonformal/org_experience/work_experience), karena Tier3 ditulis SEBELUM migration 2026_08_29_000010 memperluas form kandidat. Interface PortalSyncAdapterInterface (nama asli Tier3, cuma sisi worker) diganti nama PortalBackendAdapterInterface + ditambah 2 method sisi portal (findLatestByNationalId, saveSubmission) karena portal SIMULASI jalan di app Laravel yang sama (bukan Flutter terpisah spt asumsi Tier3), jadi butuh jalur tulis eksplisit."
  komponen_baru:
    - "app/Contracts/Recruitment/PortalBackendAdapterInterface.php"
    - "app/Services/Recruitment/{MariaDbPortalSyncAdapter,FirebaseSyncAdapter,PortalSyncService}.php"
    - "app/Providers/RecruitmentServiceProvider.php -- binding adapter dari config('recruitment.backend')"
    - "app/Console/Commands/SyncRecruitmentPortal.php -- `php artisan recruitment:sync-portal`, dijadwalkan everyTwoMinutes() di routes/console.php (recruitment_tier3.md §1.2)"
    - "app/Models/Crp/{CrpCandidateAccount,CrpSubmission,CrpDocument}.php -- koneksi 'tm2crp'"
    - "config/recruitment.php -- PORTAL_BACKEND=firebase|mariadb (.env), config/database.php koneksi 'tm2crp' (driver native Laravel 'mariadb')"
    - "firebase/{firebase.json,.firebaserc,firestore.rules,storage.rules,firestore.indexes.json} -- config Local Emulator Suite"
    - "database/ddl/tm2crp_plan_b.sql -- DDL tm2crp (dijalankan manual, BUKAN Laravel migration -- tm2crp secara arsitektur host terpisah dari tm2*, lihat CLAUDE.md §2)"
    - "resources/views/pages/recruitment/portal.blade.php direvisi -- enter()/submitApplication() lewat adapter (bukan CndCandidate/AppApplication langsung lagi), myApplications() baca tm2hrr apa adanya (eventual-consistency, kosong sampai sync worker jalan)"
  bug_ditemukan_tinker: "CrpSubmission model awalnya $guarded=['submission_uuid'] (maksud proteksi PK) -- JUSTRU memblokir create() mengisi PK itu sendiri (submission_uuid PK non-auto_increment, harus di-mass-assign). Error 'Field submission_uuid doesnt have a default value' ketahuan lewat tinker end-to-end test (Sufyan Anas dummy data), bukan php -l. Fix: $guarded=[] (model ini cuma diisi kode adapter sendiri, bukan raw request user, jadi aman)."
  verifikasi: "End-to-end via tinker: portal write ke tm2crp (adapter->saveSubmission) -> php artisan recruitment:sync-portal -> tm2hrr (CndCandidate upsert + 3 CndWorkExperience + AppApplication + RcrSyncLog result=OK) -- pakai data dummy Sufyan Anas asli dari docs/attachments/ (CV Glints TapLoker + form portal.pdf), lihat project_recruitment_portal_simulation.md di memory utk identitas kandidat ini. Idempotency dicek (run sync 2x, tidak dobel insert). Plan A (Firebase emulator) diverifikasi terpisah, lihat catatan verifikasi_firebase di bawah kalau ada."
  known_simplification:
    - "Dokumen upload (CV/ijazah) TETAP di disk 'public' Laravel utk KEDUA backend (Plan A/B) -- bukan Firebase Storage emulator sungguhan. storage.rules tetap disiapkan di firebase/ utk portal Flutter asli nanti."
    - "pushStatusUpdate() (kontrak Tier3 §1.2, internal->portal) di-implementasi sbg no-op di kedua adapter -- portal simulasi baca status lamaran lewat myApplications() query langsung ke tm2hrr (situasional, krn portal & internal 1 codebase di simulasi ini), bukan lewat backend portal."
    - "crp_candidate_account (Plan B) & Firebase Auth (Plan A) TIDAK dipakai buat autentikasi sungguhan -- portal simulasi tetap KTP-only per keputusan awal 2026-08-29 'jangan investasi berlebihan di sisi auth'. Kolom account tetap ada di skema utk saat portal Flutter asli butuh login sungguhan."
