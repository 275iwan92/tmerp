keputusan_bisnis_terkonfirmasi:
  - "PPh21 monthly-only permanen (lihat engine_dan_service.Pph21TerService)"
  - "GPS clock-in DIBANGUN (2026-09-07) -- membatalkan catatan lama BACKLOG §12.5 'tidak diminta, tidak dibangun' krn user minta 2x"
  - "Menu sidebar 'Time Attendance' harus tampil SEBELUM 'Payroll' (absen dulu baru payroll bisa jalan) -- sort_order ditukar"
  - "Salary encryption sudah live sejak fondasi awal, tidak perlu dikerjakan ulang"

item_terbuka_belum_selesai:
  - "PPh21/BPJS: base perhitungan sesuai Tier2, tapi rate/bracket masih [DELTA-CONFIRM] utk sebagian nilai (mis. multiplier lembur 1.5x/2.0x belum dikonfirmasi bisnis)"
  - "Uang Roti eligibility MISMATCH dgn data nyata: rule saat ini cuma cocokkan posisi mengandung 'STAFF'/'SPV' (Tier2 §4.4 literal), tapi Excel asli tetap membayar staf level Operator (mis. 'Senior Heidelberg Operator'). BELUM DIPERBAIKI -- pertanyaan terbuka ke user, jangan diperlebar sendiri tanpa konfirmasi."
  - "TJ_KEAHLIAN saat ini free-form per-karyawan (pyr_employee_salary.tj_keahlian_monthly), padahal data nyata pakai lookup berbasis posisi (sheet REFF_KEAHLIAN) -- belum diadopsi"
  - "LEMBUR /JAM: ada rate lembur per-jam nyata di data Excel, belum di-wire ke engine (masih pakai pyr_overtime_rate generik)"
  - "Journal posting hook saat run CLOSE -- belum dibangun"
  - "Generate file transfer bank/pencairan cash fisik -- PAID saat ini cuma status flag, belum ada file output nyata per bank"
  - "Tracking channel pengiriman slip gaji per-karyawan -- belum ada"
  - "emp_overtime_request belum ada UI submit/approval -- hanya bisa lewat seed manual"
  - "Format export CSV bank transfer masih generik, bukan format kliring bank asli (BCA/Mandiri, dst)"
  - "ElectronicSignatureService (tanda tangan elektronik slip gaji) dari paket referensi -- belum mulai dikerjakan"

