    menu: "HRM_PAYROLL_SALARY"
    fungsi: "Grid karyawan aktif + status gaji, form set komponen gaji + PTKP + toggle BPJS/PPh21 (versioning: nonaktifkan baris lama via effective_to, bukan overwrite)"
  - kode: "Modul 03"
