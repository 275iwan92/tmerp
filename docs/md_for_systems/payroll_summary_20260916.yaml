  - kode: "Modul 05"
    file: "hrm/payroll-bank-transfer.blade.php"
    menu: "HRM_PAYROLL_BANKXFER"
    fungsi: "Daftar karyawan berekening aktif utk run CONFIRMED+, export CSV generik (BUKAN format kliring bank asli BCA/Mandiri -- item terbuka)"
