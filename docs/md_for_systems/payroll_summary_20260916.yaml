  - kode: "hrm.attendance-daily"
    file: "hrm/attendance-daily.blade.php"
    menu: "HRM_ATTENDANCE (id 973, sebelumnya NOT_BUILT sejak 2026-08-24)"
    fungsi: "Grid att_daily_status + stat box + tombol Hitung Ulang Presensi + modal manual override (wajib alasan >=10 karakter)"
  - kode: "Master Gaji"
