    Segmentasi akun AR/AP customer/supplier pakai trade_type (local/import, huruf kecil).
    Tabel baru fin_partner_segment_default (partner_type, trade_type) -> account_id, sbg
    default lapis-1; fin_partner_account (existing) jadi hasil resolve + kolom is_overridden
    baru supaya override manual user tak tertimpa auto-fill berikutnya. Lihat
    financeaccounting_delta_partner_category_coa_v2.md §3. STATUS: DDL §3.1-3.2 boleh
    jalan, Observer auto-fill (§3.3) DITAHAN sampai skema fin_partner_account aktual
    diverifikasi (belum diupload user per 2026-08-27).
  F_prod_category_fallback_2026-08-27: >
    Akun Persediaan/HPP Produk Jadi resolve 3-lapis: prod_part.*_account_id (paling
    spesifik, existing) -> prod_product.*_account_id (existing) -> prod_category.
    default_*_account_id (BARU, satu-satunya kolom yang ditambahkan — prod_category,
    prod_product, prod_part semua SUDAH punya field terkait sebelum sesi ini). Lihat
    financeaccounting_delta_partner_category_coa_v2.md §2.
  G_period_close_engine_2026-08-27: >
    Engine periode posting bulanan+tahunan BARU DIBANGUN (sebelumnya tidak ada sama sekali).
    Model 3-status OPEN/ON_HOLD/CLOSED (pola D365), CLOSED IREVERSIBEL PENUH (tak ada reopen
    dalam kondisi apa pun). Gate HARD BLOCK: fin_period tak bisa CLOSED selama inv_period
    bulan sama belum CLOSED (justifikasi: ireversibel + tanpa gate = risiko selisih GL vs
    Inventory permanen tak terkoreksi). Periode 13 = adjustment (pola SAP/D365). Year-end
    closing = voucher DRAFT diusulkan sistem, WAJIB direview & di-POST manual sebelum periode
    12 di-CLOSED — bukan auto-post. Lihat financeaccounting_delta_period_close.md.
    PRASYARAT: PeriodService::assertOpen() di Inventory (dorman sejak dibuat) HARUS
    disambungkan sungguhan — dicatat juga di inventory_state.yaml (INV-PERIODSERVICE-DORMANT).

