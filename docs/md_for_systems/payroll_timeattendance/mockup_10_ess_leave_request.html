<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 10 — Pengajuan Sakit/Izin/Cuti dari User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-4 font-sans text-slate-800">
    <!-- Mobile App Simulator Frame -->
    <div class="w-full max-w-sm bg-slate-100 rounded-3xl shadow-2xl overflow-hidden border-4 border-slate-700">
        <!-- Header Profile -->
        <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
            <span class="font-bold text-sm">Form Perizinan Karyawan</span>
            <span class="text-xs bg-blue-700 px-2 py-0.5 rounded">Cuti Tahunan: 8 Hari</span>
        </div>

        <form onsubmit="submitForm(event)" class="p-5 space-y-3 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Jenis Perizinan</label>
                <select id="leave-type" class="w-full border rounded-lg p-2 bg-white" onchange="toggleUpload()">
                    <option value="S">Sakit (Wajib Surat Dokter + Kwitansi)</option>
                    <option value="I">Izin (Keperluan Pribadi / Acara)</option>
                    <option value="C">Cuti Tahunan (Maks H-7)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Tgl Mulai</label>
                    <input type="date" value="2026-08-28" class="w-full border rounded-lg p-2 bg-white">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Tgl Selesai</label>
                    <input type="date" value="2026-08-28" class="w-full border rounded-lg p-2 bg-white">
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Alasan Pengajuan</label>
                <textarea rows="3" placeholder="Jelaskan alasan perizinan..." class="w-full border rounded-lg p-2 bg-white" required></textarea>
            </div>

            <div id="upload-box" class="bg-white border-2 border-dashed border-slate-300 rounded-lg p-3 text-center">
                <span class="text-slate-500 text-[11px] block">📎 Upload Surat Dokter & Kwitansi Obat</span>
                <input type="file" class="text-[10px] mt-1 text-slate-400">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg mt-2">
                🚀 Kirim Pengajuan ke HRD
            </button>
        </form>
    </div>

    <script>
        function toggleUpload() {
            const type = document.getElementById('leave-type').value;
            document.getElementById('upload-box').style.display = (type === 'S') ? 'block' : 'none';
        }
        function submitForm(e) {
            e.preventDefault();
            alert('Pengajuan berhasil dikirim ke SPV dan HRD untuk diverifikasi!');
        }
    </script>
</body>
</html>
