modul: "05_dispatch"
db: tm2sdi
fase: "1 — Delivery Order + Surat Jalan (satu objek, dua cetakan), konsolidasi lintas-CO, no-merge rule"
status_umum: >
  BARU TAHAP SPEC (2026-08-26) -- Tier 1-4 + rules.yaml + state.yaml + mockup HTML simulasi
  sudah ditulis lengkap, BELUM ADA implementasi Livewire/DDL sungguhan. Sesi ini juga
  mengoreksi asumsi lama di flowengine_tier1.md §4 (module_code DO dan DN dianggap dua
  dokumen terpisah) -- diputuskan JADI SATU objek data (do_delivery/do_line) dengan dua
  cetakan, berdasar riset komparatif SAP/Oracle/D365/Odoo. Keputusan inti lain yang
  dikunci sesi ini: konsolidasi lintas-CO di level baris (bukan header), no-merge rule
  (item sama nama tapi beda harga = 2 baris terpisah, kunci identitas co_order_item_id),
  qty_available dihitung live via VIEW (TIDAK ada ALTER ke co_order_delivery yang sudah
  live), satu DO = satu shipping event tunggal.

  SELESAI 2026-08-28 (sesi Telma, Inventory & Delivery): implementasi PENUH v1 --
  migration `2026_08_28_000011` (do_delivery/do_line + VIEW v_co_delivery_outstanding/
  v_do_list, cross-DB VIEW tm2sdi->tm2mst DIIZINKAN dgn privilege tm2user yang ada,
  dibuktikan sesi ini di tm2inv->tm2mst) + `2026_08_28_000012` (modul sec_module DISPATCH
  + menu sidebar, digrant ke SALES_STAFF/SALES_SPV/OPS_MGR/DIREKSI -- tidak ada grup
  "Gudang/Ekspedisi" tersendiri saat ini, OPS_MGR paling dekat). App\Services\Dispatch\
  DispatchService (pullLines/updateLineQty/updateLinePrice/removeLine/confirm/
  markShipped/cancel) + 2 Model (DoDelivery/DoLine) + 2 layar Livewire (DoList grid,
  DoEntry Blok A-D) + 2 cetakan (`x-print.document`, keluarga "Nota" per
  printnotastandard.md §1 -- DO Sisi A berharga, Surat Jalan Sisi B TANPA harga di
  query, bukan cuma CSS). Persist auto-save per aksi (dicek dulu ke co/entry.blade.php
  sesuai catatan Tier4 §7.2, BUKAN draft-buffer).

  DEVIASI dari teks Tier3/4 (dicatat, dicek dulu ke skema nyata bukan improvisasi):
  (1) do_delivery TIDAK punya ship_address_id -> cust_address (tabel itu TIDAK ADA) --
  diselaraskan ke pola co_order yang sudah live: ship_area_id/ship_area_level +
  ship_address_label/detail/postal_code (App\Livewire\AddressPicker, sama komponen
  dipakai co/entry.blade.php). (2) "+ New Record" di DoList TIDAK "masuk Entry kosong
  pilih customer" persis spt teks Tier4 §2 -- karena do_delivery.customer_id NOT NULL
  (Tier3 §2, DISPATCH-01), dipakai picker customer DULU (pola persis quotation/
  list.blade.php: search+klik+redirect), baru masuk Entry yang customer-nya sudah
  terisi tapi 0 baris ("kosong baris", bukan kosong customer) -- konsisten dgn DB
  constraint, bukan penyimpangan bebas.

  DIUJI TUNTAS: (a) skenario UAT penuh dispatch_tier3.md §6/tier4.md §8 via tinker
  (transaksi 2-koneksi di-rollback) -- pull no-merge 2 CO beda harga, partial pull +
  reduce qty, over-limit ditolak, remove-line kembalikan qty ke pool, confirm generate
  do_no format benar, markShipped rekalkulasi co_order_delivery per-baris (full->SHIPPED,
  partial->tetap PLANNED) -- SEMUA lolos persis sesuai ekspektasi tabel UAT Tier4 §8.
  (b) 3 test PHPUnit PERMANEN (bukan cuma tinker): tests/Feature/DispatchNoMergeRuleTest.php
  (2 test, DISPATCH-02 wajib per checklist Tier4 §9) + tests/Feature/DispatchLifecycleTest.php
  (3 test: lifecycle penuh DRAFT->CONFIRMED->SHIPPED, cancel dari CONFIRMED memulihkan
  qty_available + wajib alasan, DO print vs Surat Jalan Sisi A/B) -- semua lulus.
  (c) Livewire::test() render DoList/DoEntry/kedua cetakan tanpa exception.
  BELUM diverifikasi visual di browser sungguhan (perlu login, lihat
  `feedback_no_credential_automation`).

