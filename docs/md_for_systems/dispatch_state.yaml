open_items:
  - id: DISPATCH-STOCK-OUT-FG
    prioritas: SEDANG
    isi: >
      Transisi DO ke SHIPPED seharusnya memicu Stock Out FG di Inventory (aturan INV-06:
      "FG keluar HANYA lewat Delivery Note"). Tier 1-4 modul ini SENGAJA tidak merancang
      integrasi ini -- butuh keputusan valuasi COGS FG (AVG/FIFO) tersendiri bersama
      Inventory. v1 DO murni administratif, tidak menyentuh stok sama sekali.
  - id: DISPATCH-INVOICING-LINK
    prioritas: RENDAH (belum jadi blocker, Invoicing/Billing belum digarap)
    isi: >
      do_line.qty_invoiced sudah disiapkan (default 0, tidak dipakai modul ini) sebagai
      pijakan Fase 2. Rekomendasi riset: invoice_line mereferensikan do_line_id (bukan
      do_delivery_id/co_order_id) agar partial invoicing terhadap partial delivery, dan
      1-DO-banyak-invoice/banyak-DO-1-invoice, sama-sama mungkin tanpa perubahan struktur.
  - id: DISPATCH-PRICE-APPROVAL
    prioritas: RENDAH (kolom reserved sudah cukup untuk v1)
    isi: >
      checklistmockuperp.md (diarsipkan) MODUL 5.2 mencatat "Price-change approval (approval 3-party
      asli Costing+Sales+Finance)" sebagai item terbuka terpisah, kini boleh dikerjakan
      karena Finance sudah dibuka scope-nya (DEC-SCOPE-OPEN 2026-08-26). BELUM digarap di
      Tier ini -- kolom price_overridden/original_unit_price/price_change_approval_status
      sudah disiapkan di do_line/do_delivery, tinggal disambung flow_config module_code DO
      kalau/ketika keputusan approval-nya dibuat.
  - id: DISPATCH-DOC-NO-SEQUENCE
    prioritas: RENDAH
    isi: >
      dispatch_tier3.md §5 mengusulkan pola manual MAX+1 per tahun (sama pola
      StockPostingService lama), tapi CATATAN eksplisit di situ: cek dulu apakah modul
      lebih baru sudah pakai sys_sequence sungguhan sebelum Claude Code memutuskan pola
      penomoran do_no -- jangan asumsikan pola lama otomatis berlaku di sini.

catatan_untuk_sesi_berikutnya: >
  flowengine_tier1.md §4 masih mencantumkan module_code DO dan DN sebagai dua baris
  "Aktif" terpisah -- ini SUDAH DI-OVERRIDE oleh DISPATCH-00 (dispatch_rules.yaml), DN
  tidak dipakai. Kalau nanti membaca flowengine_tier1.md tanpa konteks ini, JANGAN
  membangun ulang DN sebagai dokumen terpisah -- baca dispatch_tier1.md §1.2 dulu.
