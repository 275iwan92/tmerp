# ═══════════════════════════════════════════════════════════════════
# FIN_RULES.yaml — ATURAN KHAS MODUL 06 FINANCE & ACCOUNTING
# Menunjuk GLOBAL_RULES (tak menyalin). Baca FIN_STATE dulu tiap sesi.
# ═══════════════════════════════════════════════════════════════════
meta:
  db: tm2acc
  prefix: fin_
  status: "modul baru — build paralel target ± akhir Nov 2026"

invarian:
  double_entry: "Σdebit = Σkredit per voucher; baris = debit XOR kredit (CHECK DB chk_dr_cr)"
  recon_partner: "akun is_recon=1 → setiap baris WAJIB partner_type+partner_id (enforce aplikasi)"
  header_akun: "is_postable=0 tak boleh dijurnal & tak muncul di selector"
  cogs: "PERPETUAL — jurnal HPP saat KIRIM, nilai = snapshot HPP Costing V2 (tak hitung ulang)"
  revenue_per_co: "co_id di LEVEL BARIS (voucher_line & invoice) — kasus cross-CO shipment"
  tax_rate: "TIDAK hardcode di nama akun → tax_scheme_code → tm2mst.fin_tax_scheme (rate saat posting)"
  cost_center: "terkontrol via fin_cost_center (FK), BUKAN free-text"
  money: "DECIMAL(18,4) (GLOBAL)"
  snapshot_revise: "voucher confirmed tak diedit; REVISE=copy-record revision_no+1; lama is_cancelled=1 SUPERSEDED"
  hard_delete: "DRAFT only"

integrasi:
  keputusan_A: "GL terintegrasi BERTAHAP — polymorphic source_type/source_id di voucher & invoice; fase-1 posting manual, fase-2 auto CO/DO/PO/RECEIVING"
  partner: "ref LOGICAL ke tm2mst.cust_customer / tm2mst.sup_supplier (business_partners DIHAPUS)"
  recon_map: "akun AR/AP per partner disimpan di fin_partner_account (di tm2acc), bukan di master partner"

tabel:
  fin_journal: "buku jurnal (CSH/BNK/SAL/PUR/GEN)"
  fin_account: "COA master, self-parent, id manual, is_recon/is_postable"
  fin_cost_center: "cost center terkontrol"
  fin_partner_account: "mapping akun recon per partner (logical ref)"
  fin_voucher: "header voucher/journal entry"
  fin_voucher_line: "baris double-entry (debit/credit, partner, cc, co_id)"
  fin_invoice: "subledger AR/AP (source polymorphic, co_id, snapshot amount)"
views:
  v1_fin_account_tree: "COA + tree_level + default_cc_code (sumber grid)"
  v1_fin_trial_balance: "neraca saldo (POSTED, not cancelled)"
  v1_fin_ar_aging: "umur piutang per CO"
  v1_fin_ap_aging: "umur hutang"

ui:
  layout: "Master COA/Voucher/AR-AP/TB = FULL-PAGE (w-full+padding), shell menu Finance"
  warna: "navy #2c3e69 / accent #2f6fed (mockup asal teal SUDAH di-recolor)"
  badge_coa: "DEBIT=biru muda, KREDIT=kuning muda, RECON=navy, TAX=abu, CC=hijau, HEADER=abu"
  sisi: "COA/GL internal = Sisi A (Direksi/Finance HPP visible). Ke Sales harus publish (Sisi B)"

dependency_logical:
  - "tm2mst.cust_customer / tm2mst.sup_supplier → partner_id"
  - "tm2mst.org_department → fin_cost_center.org_dept_id"
  - "tm2mst.fin_tax_scheme (PPN_IN/PPN_OUT/PPH22/PPH23) → rate"
  - "tm2sdi.co_order → co_id"
  - "Costing V2 → snapshot HPP untuk COGS"
