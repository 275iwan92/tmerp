# ═══════════════════════════════════════════════════════════════════
# procurement_rules.yaml — ATURAN KHAS MODUL 04 PROCUREMENT
# Menunjuk GLOBAL_RULES (tak menyalin). Baca PROC_STATE dulu tiap sesi.
# ═══════════════════════════════════════════════════════════════════
meta:
  db: tm2pur
  prefix: "pr_ (requisition) | pq_ | po_ | pv_ | prt_ (return)"
  status: "modul baru — spec Tier 1-4 selesai 2026-08-20, implementasi belum mulai"
  catatan_prefix: "Return memakai prt_ karena pr_ sudah dipakai Requisition"

invarian:
  anti_many_to_many: >
    PR:PO TIDAK PERNAH many-to-many. pr_line dipecah menjadi pr_line_alloc;
    tiap alokasi menjadi TEPAT SATU po_line (dijaga UNIQUE KEY uq_po_alloc).
    Baris tanpa split tetap punya 1 alokasi penuh — hanya ada satu jalur logika.
  konsolidasi_di_header: >
    Banyak PR boleh gabung ke SATU po_order (bukan satu po_line). Baris tetap
    granular per sumber; approver membaca ringkasan v1_po_item_consolidated.
  dual_uom_pv: >
    pv_line menyimpan DUA sisi independen: sisi beli (i_qty_purchase/i_uom_purchase,
    menutup PO & dasar tagihan) dan sisi stok (i_qty_stock/i_uom_stock, masuk gudang).
    conversion_to_stock master = NILAI AWAL saja, SELALU boleh ditimpa manual
    (barang curah: 3 truk pasir, tiap truk beda berat).
  qc_gerbang_posting: >
    Dua gerbang: QC qty (hitung/timbang) & QC kualitas (PASS/PARTIAL/FAIL).
    HANYA c_qty_accepted yang masuk stok. POST diblokir bila ada baris PENDING.
  toleransi_per_item: >
    Batas dari m_raw_material.tol_purchase (kolom SUDAH ADA di legacy),
    fallback sys_constant.RECEIVE_TOLERANCE_PCT (default 5).
    Di luar batas => wajib override + alasan oleh can_approve PV.
  nilai_selalu_tersimpan: >
    pv_line.c_unit_price & c_line_value SELALU diisi. Yang diatur adalah siapa
    yang boleh melihat, bukan apakah datanya ada.
  sisi_visibilitas: >
    Sisi B (gudang) = query TIDAK menyertakan kolom harga sama sekali (bukan CSS hidden).
    Sisi A (Manajer Operasional & Accounting) = nilai penuh, via PV.can_view_cost.
  tarif_pajak: "dari sys_constant (PPN, PPH23_JASA) — TIDAK di-hardcode, TIDAK bikin fin_tax_scheme baru"
  pajak_per_baris: >
    PPN atas seluruh DPP; PPh 23 HANYA atas baris SERVICE. Satu PO boleh campur
    barang + jasa, karena itu perhitungan di level BARIS bukan header.
  snapshot_kurs: >
    i_fx_rate di-snapshot dari PQ dan DIBEKUKAN saat PO APPROVED. Nilai PO/PV/nota
    tak berubah retroaktif meski kurs bergerak.
  currency_vs_potype: >
    i_currency_id INDEPENDEN dari i_po_type. Supplier LOCAL boleh berharga USD
    (mis. kertas mengikuti harga pulp dunia).
  costing_method_per_item: >
    AVG/FIFO/LIFO ditetapkan PER ITEM (m_raw_material.costing_method), bukan global.
    FIFO/LIFO memerlukan inv_stock_layer; stockcard tetap ringkasan saldo.
  revise: "PR & PO = copy-record (revision_no+1, lama is_cancelled=1 SUPERSEDED). PV & PRT TANPA REVISE (fisik)."
  recalc: "TIDAK relevan di Procurement (hanya semantik Sales/Costing)"
  hard_delete: "DRAFT only; selain itu CANCELLED (jejak dipertahankan)"
  money: "DECIMAL(18,4) (GLOBAL) | qty DECIMAL(20,4) mengikuti legacy rm_stock_d"

item_master:
  kode_5_level: >
    doc_rmprefix1..5 adalah PEMBENTUK KODE ITEM (kategori→jenis→gramatur→ukuran→merk),
    mis. P+Y+J+3+1 = PYJ31. Bukan tabel item itu sendiri.
  dua_jalur_sumber: >
    pr_line.i_item_source = MASTER_ITEM (picker 5 level) ATAU FREE_TEXT.
    Pembelian sekali pakai (mesin, laptop, renovasi) TIDAK DIPAKSA masuk hirarki —
    itulah gunanya FREE_TEXT. FREE_TEXT selalu is_stock=0 dan wajib dept + akun COA manual.
  kelas_stok: >
    RAW/INDIRECT/SERVICE diturunkan dari doc_rmprefix1.stock_class (hanya untuk MASTER_ITEM).
    FREE_TEXT selalu manual.
  beban_overhead: "diturunkan dari klasifikasi akun COA yang dipilih — BUKAN picker terpisah"

integrasi:
  inventory: >
    ADOPSI struktur legacy tm2inv apa adanya (rm_stock/rm_stock_d/rm_stockcard, sfg_*, fg_*).
    PV TIDAK membuat tabel pergerakan stok baru. Pola legacy dipertahankan:
    stat_confirm=1 memicu trigger stockcard; notes='Auto dari PV: <no>';
    rm_stock_d.reference_name='tm2pur.pv_line'.
  finance: >
    Purchase Invoice TIDAK memakai tabel pi_* baru. fin_invoice (tm2acc) sudah polymorphic
    AR+AP: CUSTOMER_INVOICE|SUPPLIER_BILL|CUSTOMER_DP|SUPPLIER_DP.
    SUPPLIER_DP terbit dari PO (tanpa PV, barang belum datang);
    SUPPLIER_BILL terbit dari pv_line (realisasi terima).
    Alokasi DP memakai fin_dp_allocation yang sudah live di sisi Sales.
  delta_fin_invoice_line: >
    fin_invoice saat ini HEADER-ONLY. fin_invoice_line adalah delta WAJIB dan
    menguntungkan Sales maupun Purchase (rincian nama barang/produk, qty, @harga).
    subtotal/tax_amount header menjadi hasil hitung dari baris.
  flow_engine: >
    module_code PR/PO/PV sudah direservasi di TIER_1_FLOW_ENGINE; PRT ditambahkan.
    Approval oleh JABATAN (+PLT), threshold nilai, riwayat ke flow_log.
    PR ditutup otomatis lewat step AUTO saat seluruh PO turunannya RECEIVED.
  mrp: "pr_requisition.i_source MANUAL|MRP + mrp_run_id nullable (reserved) — MRP belum dibangun"
  cost_tracking: >
    co_line_id menetes pr_line -> pr_line_alloc -> po_line -> pv_line.
    Tujuan: biaya material RIIL per Customer Order (realisasi) sebagai pembanding
    estimasi Costing V2 di hulu. Nullable — tak semua PR terkait order customer.

dokumen_dan_nota:
  PR: "Permintaan Pembelian (PP) — vw_nota_pr"
  PQ: "Perbandingan Penawaran Harga (PH)"
  PO: "Pesanan Pembelian — vw_nota_po — DOKUMEN EKSTERNAL ke supplier"
  PV: "Surat Penerimaan Barang (SPB) — vw_nota_pv — TANPA HARGA (Sisi B)"
  PRT: "Nota Retur Pembelian (NRB) — vw_nota_prt"
  PI: "Faktur Pembelian (FP) — fin_invoice + fin_invoice_line"
  KONTAN: "Bukti Pembelian Kontan — satu lembar mewakili PO+PV"
  istilah_SPB: "diambil dari penomoran legacy 26SPB##### agar tidak membingungkan pengguna lama"

kasus_khusus:
  po_kontan: >
    i_procure_type='CASH'. Satu layar ringkas tanpa PR/PQ; sistem AUTO-GENERATE
    po_order (APPROVED) + pv_receipt (POSTED) supaya tetap tertelusur & masuk stok.
    Approval berubah menjadi NOTIFY_ONLY — barang sudah dibeli, tak masuk akal memblokir.
  purchase_return: >
    Sumber ganda: QC_REJECT (belum pernah masuk stok => TANPA gerak stok) atau
    FROM_STOCK (rm_stock OUT, doc_cat='RETURN').
    Disposisi REPLACEMENT (tukar barang) atau CREDIT_NOTE (pengurang tagihan).
  free_sample: "item_type FREE_SAMPLE: masuk stok unit_price=0, tanpa PO/tagihan, tak mempengaruhi harga rata-rata"
  amount_berubah: "amount_snapshot dibekukan saat submit; nilai berubah => WAJIB submit ulang dari step 1"

ui:
  layout: "seluruh layar operasional FULL-PAGE (w-full+padding). JANGAN class `container`. Nota = TERPUSAT"
  warna: "navy #2c3e69 / accent #2f6fed"
  route_prefix: "/purchasing"
  layar_terpisah: >
    PO Entry dan PO Approval adalah DUA LAYAR BERBEDA, keduanya sama-sama detail.
    Approve/Reject TIDAK PERNAH muncul di layar entry.
  item_picker: "cascading 5 level (kategori→jenis→gramatur→ukuran→merk) — komponen bersama semua layar"
  masa_berlaku_quotation: "badge mencolok 🟢 berlaku / 🔴 kadaluarsa di layar approval PO"
  grid: "server-side pagination (WithPagination) + search sebagai WHERE + index DB wajib"

permission:
  modules: [PR, PO, PV, PRT]
  aksi: [can_access, can_input, can_approve, can_export]
  khusus: "PV.can_view_cost — Manajer Operasional & Accounting SAJA, JANGAN ke gudang"

di_luar_scope_fase_ini:
  - "Posting GL otomatis dari PV/PI (AP fase-2 Finance)"
  - "Bea Cukai / PIB aktif — po_import_doc INACTIVE, BM/PPN impor/PPh22 tidak dihitung (jarang impor)"
  - "Blanket PO / kontrak harga jangka panjang"
  - "Supplier performance & rating"
  - "Konsumsi FIFO/LIFO sisi OUT (milik modul Inventory)"

dependency_logical:
  - "tm2mst.m_raw_material -> item_id (material_id), tol_purchase, uom_*, costing_method"
  - "tm2mst.doc_rmprefix1..5 -> pembentuk kode item + stock_class"
  - "tm2mst.sup_supplier -> i_supplier_id"
  - "tm2mst.org_department -> i_department_id"
  - "tm2mst.fin_currency / fin_currency_rate -> i_currency_id, i_fx_rate"
  - "tm2acc.fin_account -> i_coa_account_id (is_postable=1)"
  - "tm2acc.fin_invoice / fin_invoice_line / fin_dp_allocation -> Purchase Invoice & DP"
  - "tm2inv.rm_stock / rm_stock_d / rm_stockcard / inv_stock_layer -> posting PV"
  - "tm2sdi CO line -> i_co_line_id (penelusuran biaya per order)"
  - "tm2sys.sys_constant (tarif pajak, toleransi) / sys_sequence (nomor dokumen)"
  - "flow_config / flow_config_step / flow_log -> approval PR, PO, PRT + AUTO close PR"
