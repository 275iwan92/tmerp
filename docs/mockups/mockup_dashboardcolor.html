<!DOCTYPE html>
<html lang="id" data-theme="pastel" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Theme Matrix Admin Dashboard</title>
  <style>
    /* Theme Definitions */
    :root[data-theme="light"] {
      --bg-main: #ffffff;
      --bg-card: #ffffff;
      --bg-sidebar: #fafafa;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --backdrop-blur: none;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.05);
    }
    :root[data-theme="pastel"] {
      --bg-main: var(--pastel-bg-tint);
      --bg-card: #ffffff;
      --bg-sidebar: rgba(255, 255, 255, 0.7);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: rgba(0, 0, 0, 0.05);
      --backdrop-blur: none;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.03);
    }
    :root[data-theme="bright"] {
      --bg-main: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 100%);
      --bg-card: rgba(255, 255, 255, 0.45);
      --bg-sidebar: rgba(255, 255, 255, 0.55);
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-color: rgba(255, 255, 255, 0.6);
      --backdrop-blur: blur(16px);
      --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
    :root[data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-sidebar: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --backdrop-blur: none;
      --card-shadow: none;
    }
    :root[data-theme="black"] {
      --bg-main: #000000;
      --bg-card: #09090b;
      --bg-sidebar: #09090b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
      --backdrop-blur: none;
      --card-shadow: none;
    }

    /* Accents */
    :root[data-accent="blue"] { --primary: #2563eb; --primary-light: rgba(37, 99, 235, 0.12); --pastel-bg-tint: #f0f4ff; }
    :root[data-accent="green"] { --primary: #059669; --primary-light: rgba(5, 150, 105, 0.12); --pastel-bg-tint: #f0fdf4; }
    :root[data-accent="red"] { --primary: #dc2626; --primary-light: rgba(220, 38, 38, 0.12); --pastel-bg-tint: #fff1f2; }
    :root[data-accent="purple"] { --primary: #8b5cf6; --primary-light: rgba(139, 92, 246, 0.12); --pastel-bg-tint: #f5f3ff; }
    :root[data-accent="amber"] { --primary: #f59e0b; --primary-light: rgba(245, 158, 11, 0.12); --pastel-bg-tint: #fffbeb; }
    :root[data-accent="cyan"] { --primary: #06b6d4; --primary-light: rgba(6, 182, 212, 0.12); --pastel-bg-tint: #ecfeff; }
    :root[data-accent="mono"] { --primary: #64748b; --primary-light: rgba(100, 116, 139, 0.12); --pastel-bg-tint: #f8fafc; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

    aside { 
      width: 250px; 
      background: var(--bg-sidebar); 
      border-right: 1px solid var(--border-color); 
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      backdrop-filter: var(--backdrop-blur);
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; letter-spacing: -0.5px; }
    .nav-item { padding: 10px 14px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
    .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

    main { flex: 1; padding: 32px; overflow-y: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }

    .switcher-panel { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      box-shadow: var(--card-shadow);
      backdrop-filter: var(--backdrop-blur);
      padding: 16px 20px; 
      border-radius: 12px; 
      margin-bottom: 32px; 
      display: flex; 
      gap: 32px; 
      align-items: center; 
      flex-wrap: wrap;
    }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .control-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    select { 
      padding: 8px 12px; 
      background: var(--bg-main); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      cursor: pointer;
      font-size: 0.85rem;
      outline: none;
    }

    /* Color Swatches Switcher */
    .color-swatches { display: flex; gap: 8px; align-items: center; }
    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--text-main); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      box-shadow: var(--card-shadow);
      backdrop-filter: var(--backdrop-blur);
      border-radius: 12px; 
      padding: 24px; 
    }
    .card-title { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
    .card-value { font-size: 1.75rem; font-weight: 700; }

    .btn-primary { 
      background-color: var(--primary); 
      color: #ffffff; 
      border: none; 
      padding: 10px 20px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <aside>
    <div class="brand">PRO-DASH</div>
    <a href="#" class="nav-item active">Dashboard</a>
    <a href="#" class="nav-item">Analytics</a>
    <a href="#" class="nav-item">Reports</a>
    <a href="#" class="nav-item">Settings</a>
  </aside>

  <main>
    <header>
      <h2>Overview</h2>
      <button class="btn-primary">+ Create New</button>
    </header>

    <!-- Theme Customization Toolbar -->
    <div class="switcher-panel">
      <div class="control-group">
        <label for="themeSelect">Base Theme Mode:</label>
        <select id="themeSelect" onchange="changeTheme(this.value)">
          <option value="light">Pure Light (Putih Bersih)</option>
          <option value="pastel" selected>Soft Pastel (Dynamic Tint)</option>
          <option value="bright">Bright (Translucent Glass)</option>
          <option value="dark">Muted Dark</option>
          <option value="black">Pitch Black (OLED)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Corak Aksen (Color Pattern):</label>
        <div class="color-swatches">
          <div class="swatch active" style="background:#2563eb;" title="Blue" onclick="changeAccent('blue', this)"></div>
          <div class="swatch" style="background:#059669;" title="Green" onclick="changeAccent('green', this)"></div>
          <div class="swatch" style="background:#dc2626;" title="Red" onclick="changeAccent('red', this)"></div>
          <div class="swatch" style="background:#8b5cf6;" title="Purple" onclick="changeAccent('purple', this)"></div>
          <div class="swatch" style="background:#f59e0b;" title="Amber" onclick="changeAccent('amber', this)"></div>
          <div class="swatch" style="background:#06b6d4;" title="Cyan" onclick="changeAccent('cyan', this)"></div>
          <div class="swatch" style="background:#64748b;" title="Monochrome" onclick="changeAccent('mono', this)"></div>
        </div>
      </div>
    </div>

    <!-- Cards Grid -->
    <div class="grid">
      <div class="card">
        <div class="card-title">Total Revenue</div>
        <div class="card-value">$142,850.00</div>
      </div>
      <div class="card">
        <div class="card-title">Active Projects</div>
        <div class="card-value">28 Active</div>
      </div>
      <div class="card">
        <div class="card-title">System Load</div>
        <div class="card-value">18.2%</div>
      </div>
    </div>

  </main>

  <script>
    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }
    function changeAccent(accent, element) {
      document.documentElement.setAttribute('data-accent', accent);
      document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
