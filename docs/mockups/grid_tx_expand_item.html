<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Grid Transactional - isi Expand (pratinjau)</title>
<link rel="stylesheet" href="../../packages/devlib/resources/assets/devlib.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--dl-bg);font-family:var(--dl-font);color:var(--dl-ink)}
  h1{font-size:17px;margin:0 0 4px;color:var(--dl-ink-strong)}
  .lead{font-size:13px;color:var(--dl-f-muted);margin:0 0 16px}
  .opt{margin-bottom:16px}
  .opt__head{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .opt__tag{font-size:12px;font-weight:800;color:#fff;background:var(--dl-ink-strong);border-radius:6px;padding:3px 9px}
  .opt__tag--rec{background:var(--dl-green)}
  .opt__title{font-size:14px;font-weight:700;color:var(--dl-ink-strong)}
  .opt__note{font-size:12.5px;color:var(--dl-f-muted)}
  .dl-grid{--dl-grid-pad:4px}
  .doc{display:inline-flex;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums;width:160px;box-sizing:border-box;flex-direction:column;align-items:flex-start;line-height:1.25;padding:4px 10px;border-radius:var(--dl-radius);color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .doc__no{font-size:12.5px;font-weight:800}
  .doc__name{font-size:11.5px;opacity:.93;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .names{padding:6px 10px 8px 44px;font-size:12.5px}
  .names small{display:block;color:var(--dl-muted);font-size:11px;margin-bottom:2px}
  .names b{color:var(--dl-ink-strong);font-weight:600}
</style>
</head>
<body>
<h1>Grid Transactional &mdash; baris induk 5 sampai 8 kolom, baris anak (Expand) sampai 7 kolom</h1>
<p class="lead">Revisi 3. Baris kedua tiap contoh sedang dibuka. Nama item / product selalu ada di baris anak. Tanpa kolom jumlah item dan tanpa tulisan jumlah baris.</p>

<div id="out"></div>

<script>
const p1 = [['#a63fc9', '#b2378c'], ['#3f62d6', '#6b3bb5'], ['#e8743b', '#d4537e'], ['#17a59c', '#2f6fed']];
const tag = (no, name, i) => `<span class="doc" style="--c1:${p1[i][0]};--c2:${p1[i][1]}"><span class="doc__no">${no}</span><span class="doc__name">${name}</span></span>`;
const th = l => `<th class="is-sortable">${l} <i class="fa-solid fa-sort"></i></th>`;
const nth = l => `<th class="num is-sortable">${l} <i class="fa-solid fa-sort"></i></th>`;
const act = open => `<td class="dl-grid__act"><button type="button" class="dl-iconbtn"><i class="fa-solid fa-up-right-from-square"></i></button></td><td class="dl-grid__exp"><button type="button" class="dl-grid__chev ${open ? 'is-open' : ''}"><i class="fa-solid fa-chevron-right"></i></button></td>`;
const wrap = (head, body) => `<div class="dl-grid dl-grid--entry"><div class="dl-grid__panel"><div class="dl-grid__wrap" style="border-top:none"><table class="dl-grid__table"><thead><tr><th class="dl-grid__act"></th><th class="dl-grid__exp"></th>${head}</tr></thead><tbody>${body}</tbody></table></div></div></div>`;
const head = (title, note) => `<div class="opt__head"><span class="opt__title">${title}</span><span class="opt__note">${note}</span></div>`;
const badge = (t, tone) => `<span class="dl-badge dl-badge--pill dl-badge--${tone}">${t}</span>`;
const child = (span, title, cols, rows) => `<tr class="dl-grid__detail"><td colspan="${span}"><div class="dl-grid__nest"><b>${title}</b><table><thead><tr>${cols.map(c => `<th class="${c[1] || ''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((v, i) => `<td class="${cols[i][1] || ''}">${cols[i][2] ? `<b>${v}</b>` : v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></td></tr>`;

// PO: induk 7 kolom, anak 7 kolom
const po = [
  ['PO-2609-0001', 'UD Lem Sejahtera', '02-Sep-2026', '09-Sep-2026', 'Net 30', 'Rp 52.152.240', 'Reguler', 0],
  ['PO-2609-0002', 'CV Tinta Nusantara', '03-Sep-2026', '10-Sep-2026', 'Net 14', 'Rp 32.934.810', 'Reguler', 1],
  ['PO-2609-0003', 'PT Plat Offset Prima', '04-Sep-2026', '11-Sep-2026', 'COD', 'Rp 98.956.500', 'Kirim bertahap', 2],
];
const poHead = th('No. PO / Supplier') + th('Tanggal') + th('Tgl Kirim') + th('Syarat Bayar') + nth('Jumlah') + th('Status') + th('Catatan');
const poChild = child(9, 'Item', [['Kode'], ['Nama Item', '', 1], ['Spesifikasi'], ['Qty', 'num'], ['Satuan'], ['Diterima', 'num'], ['Sisa', 'num']], [
  ['TNT-CY-01', 'Tinta Offset Process Cyan', 'Kaleng 1 kg', 25, 'Kaleng', 10, 15],
  ['TNT-MG-01', 'Tinta Offset Process Magenta', 'Kaleng 1 kg', 25, 'Kaleng', 25, 0],
  ['TNT-PT-485', 'Tinta Khusus Pantone 485 C', 'Kaleng 1 kg', 10, 'Kaleng', 0, 10],
]);
const poBody = po.map((r, i) => `<tr class="dl-grid__row">${act(i === 1)}<td>${tag(r[0], r[1], r[7])}</td><td class="dl-grid__date">${r[2]}</td><td class="dl-grid__date">${r[3]}</td><td>${r[4]}</td><td class="num">${r[5]}</td><td>${badge('Confirmed', 'success')}</td><td><div class="dl-grid__txt">${r[6]}</div></td></tr>` + (i === 1 ? poChild : '')).join('');

// Inquiry: induk 7 kolom, anak 7 kolom
const iq = [
  ['IQ2690071', 'PT Sari Rasa Nusantara', '22-Sep-2026', 'Box Kue Lapis 20x20x8', '5.000', 'NEW', '29-Sep-2026', 3],
  ['IQ2690072', 'CV Herbal Alam Segar', '23-Sep-2026', 'Hardbox Teh Premium isi 25', '20.000', 'NEW', '30-Sep-2026', 1],
  ['IQ2690073', 'PT Kosmetika Indah', '24-Sep-2026', 'Sleeve Serum 30 ml', '10.000', 'REVISE', '01-Oct-2026', 0],
];
const iqHead = th('No. Inquiry / Customer') + th('Tanggal') + th('Product') + nth('Qty') + th('Jenis') + th('Status') + th('Deadline Quotation');
const iqChild = child(9, 'Product: Hardbox Teh Premium isi 25', [['Part', '', 1], ['Peran'], ['Tipe Produk'], ['Ukuran (mm)'], ['Bahan'], ['Warna'], ['Finishing']], [
  ['Body', 'Body', 'Rigid Box Base', '160 x 120 x 60', 'Greyboard 2 mm + Art Paper 150', '4/0', 'Laminasi Doff'],
  ['Lid', 'Lid', 'Rigid Box Lid', '164 x 124 x 30', 'Greyboard 2 mm + Art Paper 150', '4/0 + Emas', 'Laminasi Doff, Hot Print'],
]);
const iqBody = iq.map((r, i) => `<tr class="dl-grid__row">${act(i === 1)}<td>${tag(r[0], r[1], r[7])}</td><td class="dl-grid__date">${r[2]}</td><td><div class="dl-grid__txt">${r[3]}</div></td><td class="num">${r[4]}</td><td>${badge(r[5], 'info')}</td><td>${badge('DRAFT', 'neutral')}</td><td class="dl-grid__date">${r[6]}</td></tr>` + (i === 1 ? iqChild : '')).join('');

document.getElementById('out').innerHTML =
  `<section class="opt">${head('Dokumen banyak baris (contoh PO)', 'Induk 7 kolom. Anak 7 kolom: Kode, Nama Item, Spesifikasi, Qty, Satuan, Diterima, Sisa.')}${wrap(poHead, poBody)}</section>
   <section class="opt">${head('Dokumen satu product (contoh Inquiry)', 'Induk 7 kolom. Anak: nama product sebagai judul, lalu 7 kolom part.')}${wrap(iqHead, iqBody)}</section>`;
</script>
</body>
</html>
