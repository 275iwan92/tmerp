<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Grid Transactional - isi Expand (pratinjau)</title>
<link rel="stylesheet" href="../../packages/devlib/resources/assets/devlib.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--dl-bg);font-family:var(--dl-font);color:var(--dl-ink)}
  h1{font-size:17px;margin:0 0 4px;color:var(--dl-ink-strong)}
  .lead{font-size:13px;color:var(--dl-f-muted);margin:0 0 16px}
  .opt{margin-bottom:16px}
  .opt__head{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .opt__tag{font-size:12px;font-weight:800;color:#fff;background:var(--dl-ink-strong);border-radius:6px;padding:3px 9px}
  .opt__tag--rec{background:var(--dl-green)}
  .opt__title{font-size:14px;font-weight:700;color:var(--dl-ink-strong)}
  .opt__note{font-size:12.5px;color:var(--dl-f-muted)}
  .dl-grid{--dl-grid-pad:4px}
  .doc{display:inline-flex;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums;width:160px;box-sizing:border-box;flex-direction:column;align-items:flex-start;line-height:1.25;padding:4px 10px;border-radius:var(--dl-radius);color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .doc__no{font-size:12.5px;font-weight:800}
  .doc__name{font-size:11.5px;opacity:.93;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .names{padding:6px 10px 8px 44px;font-size:12.5px}
  .names small{display:block;color:var(--dl-muted);font-size:11px;margin-bottom:2px}
  .names b{color:var(--dl-ink-strong);font-weight:600}
</style>
</head>
<body>
<h1>Grid Transactional &mdash; isi baris saat di-Expand: nama product / nama item selalu muncul</h1>
<p class="lead">Revisi 2: kolom jumlah item di grid dan tulisan jumlah baris di dalam Expand dihapus. Baris kedua tiap contoh sedang dibuka. Kolom pertama sudah memakai persegi Palet 1.</p>

<div id="out"></div>

<script>
const p1 = [['#a63fc9', '#b2378c'], ['#3f62d6', '#6b3bb5'], ['#e8743b', '#d4537e'], ['#17a59c', '#2f6fed']];
const po = [
  ['PO-2609-0001', 'UD Lem Sejahtera', '02-Sep-2026', 4, 'Rp 52.152.240', 0],
  ['PO-2609-0002', 'CV Tinta Nusantara', '03-Sep-2026', 3, 'Rp 32.934.810', 1],
  ['PO-2609-0003', 'PT Plat Offset Prima', '04-Sep-2026', 2, 'Rp 98.956.500', 2],
];
const lines = [
  ['TNT-CY-01', 'Tinta Offset Process Cyan', 'Kaleng 1 kg', 25, 'Kaleng'],
  ['TNT-MG-01', 'Tinta Offset Process Magenta', 'Kaleng 1 kg', 25, 'Kaleng'],
  ['TNT-PT-485', 'Tinta Khusus Pantone 485 C', 'Kaleng 1 kg', 10, 'Kaleng'],
];
const iq = [
  ['IQ2690071', 'PT Sari Rasa Nusantara', '22-Sep-2026', 'Box Kue Lapis 20x20x8', '5.000', 'NEW', 3],
  ['IQ2690072', 'CV Herbal Alam Segar', '23-Sep-2026', 'Dus Teh Celup isi 25', '20.000', 'RECALC', 1],
  ['IQ2690073', 'PT Kosmetika Indah', '24-Sep-2026', 'Sleeve Serum 30 ml', '10.000', 'REVISE', 0],
];
const tag = (no, name, i) => `<span class="doc" style="--c1:${p1[i][0]};--c2:${p1[i][1]}"><span class="doc__no">${no}</span><span class="doc__name">${name}</span></span>`;
const th = l => `<th class="is-sortable">${l} <i class="fa-solid fa-sort"></i></th>`;
const act = open => `<td class="dl-grid__act"><button type="button" class="dl-iconbtn"><i class="fa-solid fa-up-right-from-square"></i></button></td><td class="dl-grid__exp"><button type="button" class="dl-grid__chev ${open ? 'is-open' : ''}"><i class="fa-solid fa-chevron-right"></i></button></td>`;
const wrap = (head, body) => `<div class="dl-grid dl-grid--entry"><div class="dl-grid__panel"><div class="dl-grid__wrap" style="border-top:none"><table class="dl-grid__table"><thead><tr><th class="dl-grid__act"></th><th class="dl-grid__exp"></th>${head}</tr></thead><tbody>${body}</tbody></table></div></div></div>`;
const head = (cls, tagTxt, title, note) => `<div class="opt__head"><span class="opt__tag ${cls}">${tagTxt}</span><span class="opt__title">${title}</span><span class="opt__note">${note}</span></div>`;

const poHead = th('No. PO / Supplier') + th('Tanggal') + '<th class="num">Jumlah</th>' + th('Status');
const poRow = (r, open) => `<tr class="dl-grid__row">${act(open)}<td>${tag(r[0], r[1], r[5])}</td><td class="dl-grid__date">${r[2]}</td><td class="num">${r[4]}</td><td><span class="dl-badge dl-badge--pill dl-badge--success">Confirmed</span></td></tr>`;
const poBody = detail => po.map((r, i) => poRow(r, i === 1) + (i === 1 ? detail : '')).join('');

const table = `<tr class="dl-grid__detail"><td colspan="6"><div class="dl-grid__nest"><b>Item</b><table><thead><tr><th>Kode</th><th>Nama Item</th><th>Spesifikasi</th><th class="num">Qty</th><th>Satuan</th></tr></thead><tbody>${lines.map(l => `<tr><td>${l[0]}</td><td><b>${l[1]}</b></td><td>${l[2]}</td><td class="num">${l[3]}</td><td>${l[4]}</td></tr>`).join('')}</tbody></table></div>
  <div class="dl-grid__detailbox"><div><small>Pemohon</small><b>Rina Purchasing</b></div><div><small>Catatan</small><b>Reguler</b></div></div></td></tr>`;
const list = `<tr class="dl-grid__detail"><td colspan="6"><div class="names"><small>Item</small><b>${lines.map(l => l[1]).join(' &nbsp;&middot;&nbsp; ')}</b></div>
  <div class="dl-grid__detailbox"><div><small>Pemohon</small><b>Rina Purchasing</b></div><div><small>Catatan</small><b>Reguler</b></div></div></td></tr>`;

const iqHead = th('No. Inquiry / Customer') + th('Tanggal') + th('Product') + '<th class="num">Qty</th>' + th('Jenis') + th('Status');
const iqDetail = `<tr class="dl-grid__detail"><td colspan="8"><div class="dl-grid__detailbox"><div><small>Product</small><b>Dus Teh Celup isi 25</b></div><div><small>Tipe Produk</small><b>Reverse Tuck End</b></div><div><small>PIC Sales</small><b>Dewi Kusuma</b></div><div><small>Deadline quotation</small><b>30-Sep-2026</b></div></div></td></tr>`;
const iqBody = iq.map((r, i) => `<tr class="dl-grid__row">${act(i === 1)}<td>${tag(r[0], r[1], r[6])}</td><td class="dl-grid__date">${r[2]}</td><td><div class="dl-grid__txt">${r[3]}</div></td><td class="num">${r[4]}</td><td><span class="dl-badge dl-badge--pill dl-badge--info">${r[5]}</span></td><td><span class="dl-badge dl-badge--pill dl-badge--neutral">DRAFT</span></td></tr>` + (i === 1 ? iqDetail : '')).join('');

document.getElementById('out').innerHTML =
  `<section class="opt">${head('opt__tag--rec', 'Cara 1 (saran)', 'Dokumen banyak baris: tabel item di dalam baris yang dibuka', 'PO, PR, penerimaan, Quotation, Customer Order, DO, Surat Jalan. Tanpa harga, supaya aman untuk semua pemakai.')}${wrap(poHead, poBody(table))}</section>
   <section class="opt">${head('', 'Cara 2', 'Dokumen banyak baris: nama item ditulis berjajar satu baris', 'Lebih pendek, tetapi tanpa qty dan satuan.')}${wrap(poHead, poBody(list))}</section>
   <section class="opt">${head('', 'Dokumen satu product', 'Nama product ditulis sebagai isian pertama', 'Inquiry, ProDev, Work Order, CPDEL. Sama untuk Cara 1 maupun Cara 2.')}${wrap(iqHead, iqBody)}</section>`;
</script>
</body>
</html>
