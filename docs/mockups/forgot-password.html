<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password — TELASIH MAKMUR ERP</title>
<style>
  :root{--navy:#34406b;--navy-dark:#2b3560;--bg:#eef1f6;--border:#e3e7f0;--ink:#3a4568;--ink-strong:#2f3a5e;--muted:#9aa3bd;--blue:#2f6fed;--blue-dark:#255bd4;--ok:#2e9e5b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;width:100%;max-width:420px;border-radius:16px;box-shadow:0 16px 50px rgba(30,40,80,.14);overflow:hidden}
  .top{background:linear-gradient(160deg,var(--navy),var(--navy-dark));color:#fff;padding:26px 30px;display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px}
  .top .logo{font-size:26px}
  .body{padding:30px}
  .body h2{font-size:22px;color:var(--ink-strong);margin-bottom:8px}
  .body .sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
  input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;font-size:14.5px;color:var(--ink-strong);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:9px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px;transition:background .15s}
  .btn:hover{background:var(--blue-dark)}
  .back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--blue);text-decoration:none;font-size:14px;font-weight:600}
  .back:hover{text-decoration:underline}
  .done{display:none;background:#e9f7ef;color:var(--ok);border:1px solid #bfe6cd;border-radius:9px;padding:14px;font-size:14px;text-align:center;margin-bottom:8px}
  .done.show{display:block}
  .form.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="logo">📦</span> TELASIH MAKMUR</div>
  <div class="body">
    <h2 data-i18n="fp_heading">Lupa password</h2>
    <p class="sub" data-i18n="fp_sub">Masukkan email akun Anda. Kami kirim tautan untuk atur ulang password.</p>

    <div class="done" id="done" data-i18n="fp_done">Jika email terdaftar, tautan reset sudah dikirim.</div>

    <div class="form" id="form">
      <label data-i18n="label_email">Email</label>
      <input type="email" id="email" placeholder="nama@telasih.co.id">
      <button class="btn" id="send" data-i18n="btn_send">Kirim tautan reset</button>
    </div>

    <a class="back" id="back" href="login.html"><span>←</span> <span data-i18n="back_login">Kembali ke halaman masuk</span></a>
  </div>
</div>

<script>
  const T={
    id:{fp_heading:'Lupa password',fp_sub:'Masukkan email akun Anda. Kami kirim tautan untuk atur ulang password.',label_email:'Email',btn_send:'Kirim tautan reset',back_login:'Kembali ke halaman masuk',fp_done:'Jika email terdaftar, tautan reset sudah dikirim.'},
    en:{fp_heading:'Forgot password',fp_sub:'Enter your account email. We will send a reset link.',label_email:'Email',btn_send:'Send reset link',back_login:'Back to sign in',fp_done:'If the email is registered, a reset link has been sent.'}
  };
  let lang=(new URLSearchParams(location.search).get('lang'))||'id';
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T[lang][k])el.textContent=T[lang][k];});
  document.getElementById('back').href='login.html?lang='+lang;

  document.getElementById('send').addEventListener('click',()=>{
    // PRODUKSI: kirim email hanya jika terdaftar; pesan selalu sama demi keamanan.
    document.getElementById('form').classList.add('hidden');
    document.getElementById('done').classList.add('show');
  });
</script>
</body>
</html>
