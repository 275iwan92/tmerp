# ═══════════════════════════════════════════════════════════════════
# KEPUTUSAN ARSITEKTUR TERKUNCI
# ═══════════════════════════════════════════════════════════════════
keputusan_terkunci:
  pemisahan_entitas: "Requisition (kebutuhan) != Vacancy (posting/iklan) != Candidate (orang, persisten/talent pool) != Application (lamaran=candidate x vacancy, state machine nempel di sini). JANGAN disederhanakan/digabung"
  recruitment_track: "rcr_track = tabel master EXTENSIBLE (bukan ENUM hardcode) — seed STAFF/NON_STAFF/BORONGAN, bisa nambah track baru tanpa ubah skema/kode. Beda axis dari emp_contract.employment_type (TETAP/KONTRAK/HARIAN/BORONGAN) yang sudah ada di HRM"
  approval_pipeline_data_driven: "Approval chain requisition (rcr_approval_matrix), approval offer (rcr_offer_approval_matrix), dan pipeline seleksi (app_pipeline_stage_config) SEMUA data-driven per track — TIDAK hardcode di kode, konsisten prinsip pyr_status_rule di Attendance/Payroll"
  dua_host_arsitektur: "Portal kandidat (DMZ/publik, web+mobile) TERPISAH TOTAL dari internal tm2hrr (jaringan privat). Model sync PULL — internal yang inisiasi tarik data secara berkala, portal TIDAK PERNAH push masuk ke jaringan internal (antisipasi hack, keputusan eksplisit Telma)"
  portal_backend_dual_plan: |
    Plan A (PRIMARY, diasumsikan disetujui): Firebase (Firestore+Auth+Storage), region asia-southeast2 (Jakarta, kepatuhan UU PDP).
    Plan B (CADANGAN): tm2crp — MariaDB ringan di VPS terpisah, DDL sudah siap (Tier 3 SECTION 3), exposed via REST API read-only+token+IP-allowlist.
    Keduanya diisolasi dari domain logic internal via PortalSyncAdapterInterface (Tier 3 SECTION 1.1) — ganti Plan A<->B = ganti 1 config env (PORTAL_BACKEND), TIDAK sentuh business logic tm2hrr. Keputusan final A vs B BOLEH ditunda tanpa menghambat pembangunan internal.
  dedup_candidate: "Nomor KTP (national_id) = UNIQUE key dedupe di cnd_candidate. WNA pakai passport_no sbg fallback (BELUM final, lihat delta_pending)"
  family_data_scope: "cnd_family_member HANYA current job + current employer per anggota (ayah/ibu/mertua ayah/mertua ibu/pasangan/anak) — TANPA histori. Beda dari cnd_work_experience milik kandidat SENDIRI yang TETAP histori (append, bukan overwrite)"
  talent_pool_reuse: "Kandidat REJECTED/WITHDRAWN TIDAK DIHAPUS, tetap aktif & searchable di talent pool (L3). Bisa diundang ke vacancy lain (buat app_application baru) tanpa isi ulang data"
  offer_negosiasi: "Counter-offer = row app_offer BARU (previous_offer_id terisi), BUKAN edit in-place — konsisten pola REVISE/copy-record global"
  hire_trigger: "Auto-provisioning (emp_employee + emp_contract + sec_user) HANYA jalan setelah HR klik eksplisit 'Provision ke ERP' (L9) — TIDAK otomatis diam-diam saat status berubah HIRED. Idempotent via provisioned_employee_id guard"
  default_password_pattern: "Ikuti security_defaultpassword_spec.md — sec_user.default_password (Crypt, readable) + must_change_password=1, BUKAN pola baru"
  mobile_stack: "Flutter — 1 codebase Android+iOS+Web untuk portal kandidat (Tier 3 SECTION 6). Konsisten dgn alasan pemilihan Firebase (SDK sama lintas platform)"
  push_notification: "WAJIB rilis pertama (bukan fase 2) — Firebase Cloud Messaging (FCM), INDEPENDEN dari keputusan Plan A/B data (Tier 3 SECTION 6.1). Tabel cnd_device_token (tm2hrr) simpan token multi-device per kandidat. Trigger: APPLIED/INTERVIEW dijadwalkan/REJECTED/OFFERING/HIRED (Tier 2 SECTION 8.1). Isi notifikasi tanpa detail sensitif di lock-screen"

