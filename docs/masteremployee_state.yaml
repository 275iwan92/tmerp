# SHIFT ROSTER — BOARD PPIC (konsolidasi; sebagian poin sebelumnya belum tertulis eksplisit di file ini)
# ═══════════════════════════════════════════════════════════════════
shift_roster:
  scope_board: "HANYA Offset Printing pakai board PPIC drag-drop (mesin × shift × tanggal). Digital Printing & Indostry pakai grid HR sederhana tanpa mesin (toggle jumlah shift aktif, S1/S2/S3, TIDAK terikat master shift Offset)"
  assignment_authority: "PPIC assign penuh (nama+mesin+shift) di board Offset. HR read-only lihat hasil. Utk Digital Printing/Indostry, HR yg assign langsung (assigned_by_role=HR)"
  slot_kapasitas: "1 sel (mesin×shift×tanggal) bisa diisi multi-orang, maks ±3 org per sel (tiap mesin butuh 1-3 orang). Regu/kelompok TIDAK dibuat entitas terpisah krn skala kecil"
  conflict_rule: "2 tingkat, app-layer (bukan DB constraint keras): HARD = 1 org di mesin beda pada shift+tanggal SAMA (fisik tak mungkin, tolak); SOFT = 1 org di shift beda pada hari sama (boleh, mis. lanjut shift, tinjau manual PPIC/HR, ditandai oranye)"
  overtime: "is_overtime + overtime_type (REGULER/HARI_MINGGU/HARI_BESAR) menyatu di baris emp_shift_roster (bukan tabel terpisah)"
  save_confirm_workflow: "Save = status DRAFT (hanya terlihat PPIC). Confirm = status CONFIRMED (terkunci read-only, published ke HR + portal self-service karyawan 'Jadwal Saya'). Unlock = balik ke DRAFT utk revisi. Butuh tabel emp_shift_roster_batch (division_id, date_from, date_to, status, confirmed_by, confirmed_at); emp_shift_roster.batch_id sbg FK. [Keputusan dari sesi awal — sempat tidak tertulis eksplisit di file ini, dikonfirmasi ulang saat rangkuman 2026-08-18]"
  print_output: "Board PPIC punya fitur print terkontrol (mirip Master Card) utk ditempel papan pengumuman fisik — semua mesin dalam 1 halaman, kolom tanda tangan PPIC + Plant Manager"
  periode_roster: "Date range bebas (dari-sampai dipilih manual), BUKAN preset mingguan tetap"
  board_matched_to_master_shift: "[BARU, sesi 2026-08-18] Baris shift di board TIDAK LAGI hardcode 'Shift 1/2/3' generik. Sekarang pull dari master shift: emp_shift WHERE department_id = Produksi Offset Printing AND is_active=1. Label baris board = nama shift master (mis. 'TM Production Shift 1') + ringkasan jam (mis. '05:00–13:15') dari emp_shift_detail. Print-out ikut menampilkan nama+jam yg sama. Konsekuensi: kalau master shift departemen Produksi Offset berubah/nonaktif, baris di board otomatis ikut berubah — tidak ada sinkronisasi manual terpisah"
  mockup_reference: "mockup_shift_roster.html — sudah diupdate sesuai board_matched_to_master_shift di atas"

