# ═══════════════════════════════════════════════════════════════════
# PORTAL SELF-SERVICE — KATALOG PENGAJUAN (lihat detail lengkap di selfservice_panduan.md)
# ═══════════════════════════════════════════════════════════════════
self_service_katalog:
  prinsip_utama:
    - "Portal HANYA bisa dibuka oleh pemilik akun sendiri (users.employee_id match)"
    - "Data pribadi READ-ONLY di sisi karyawan — semua perubahan lewat PENGAJUAN, disetujui HR dulu baru berlaku"
    - "Semua pengajuan trigger notifikasi ke HR (modul 08_security/notification)"
    - "Prinsip upah: 'no present no pay' KECUALI Sakit(+surat dokter valid) dan Cuti — keduanya tetap dibayar"
  kelompok_a_waktu_kehadiran:
    - "Cuti Tahunan — lihat cuti_engine di bawah"
    - "Sakit — lampiran surat dokter/RS WAJIB, diupload SETELAH karyawan masuk kerja kembali (bukan saat sakit). Dibayar, tidak potong saldo cuti"
    - "Izin — tidak dibayar (no present no pay). Tidak potong saldo cuti"
    - "Cuti Khusus Berbayar — menikah, menikahkan/khitan anak, istri melahirkan, keluarga inti meninggal, ibadah (haji dst). TIDAK potong saldo cuti tahunan. Perlu lampiran sesuai jenis peristiwa"
    - "Tukar Shift — perlu approval BERTAHAP: rekan yg diajak tukar DULU, baru PPIC (karena terkait penempatan mesin)"
  kelompok_b_perubahan_data:
    - "Koreksi ejaan (nama, dll) — field sensitif (NIK KTP, Tanggal Lahir) WAJIB approval HR, tidak boleh auto-approve"
    - "Alamat KTP dan Alamat Domisili — DISIMPAN TERPISAH (2 field beda), krn banyak kasus perantau alamat tinggal ≠ KTP"
    - "Anggota keluarga: kelahiran baru (tambah), meninggal (DITANDAI + tanggal, TIDAK DIHAPUS — histori tetap ada), tambah pasangan"
    - "Status pernikahan — pengaruh PTKP/BPJS, perlu lampiran (surat nikah/cerai)"
    - "Rekening bank — ganti bank/nomor, penting utk penggajian"
    - "Kontak darurat — nama+telepon kerabat"
    - "Agama, Tanggal Lahir — ditambahkan menyusul permintaan eksplisit; Tanggal Lahir wajib approval HR (sensitif)"
  kelompok_c_dokumen_portofolio:
    - "Dokumen identitas: KTP, SIM, KK, SKCK, Passport, NPWP — upload sendiri utk dokumen milik sendiri; dokumen upload-HR terkunci read-only di sisi karyawan. Field expiry utk yg bermasa-berlaku (SIM/SKCK/Passport), 'Ajukan Perpanjangan' saat mendekati kadaluarsa"
    - "Pendidikan & Pengembangan (NILAI INVESTASI EMPLOYEE) — field: jenis(Sertifikasi/Seminar/Pelatihan/Pendidikan Formal), nama+penyelenggara, tanggal, durasi, BIAYA, DIBIAYAI OLEH(Perusahaan/Pribadi/Sharing), file sertifikat, masa berlaku, flag IKATAN DINAS. HR jumlahkan total biaya yg dibiayai PERUSAHAAN saja sbg 'nilai investasi' per karyawan (bukan yg pribadi)"
    - "Keterampilan/sertifikasi keahlian teknis — sama pola HR-locked vs self-upload"
    - "Foto Badge — lihat foto_badge di atas"
    - "BPJS — lihat bpjs di atas (hanya ajukan koreksi nomor, bukan ubah status)"
  kelompok_d_resign:
    - "Pengajuan pengunduran diri formal dgn tanggal efektif. HR/atasan proses lanjutan (serah terima). Setelah efektif → resign_date+resign_reason terisi, status jadi nonaktif"
  view_only_tanpa_pengajuan:
    - "Jadwal Saya — HANYA tampil versi CONFIRMED (draft tidak terlihat)"
    - "Kartu Pengenal — versi digital saja, cetak fisik wewenang HR"
    - "Saldo Cuti — read-only, dihitung otomatis oleh cuti_engine"

# ═══════════════════════════════════════════════════════════════════
# ENGINE CUTI — PARAMETER (BARU, DIBANGUN SEKARANG meski Payroll ditunda)
# ═══════════════════════════════════════════════════════════════════
cuti_engine:
  catatan_scope: "Ini PENGECUALIAN scope eksplisit dari user — engine cuti (bukan cuma UI) dibangun sekarang, berbeda dari Payroll penuh yg tetap ditunda"
  parameter_saat_ini:
    jatah_tahunan: "12 hari kerja/tahun (PARAMETER, bisa berubah — jangan hardcode permanen)"
    jarak_minimum_h_plus: "H+7 — tanggal mulai paling awal yg bisa dipilih = 7 hari kerja dari hari form dibuka. BUKAN sekadar warning, tanggal di bawah H+7 tidak muncul/tidak bisa dipilih di kalender (hard block via UI)"
    maksimum_per_pengajuan: "3 hari kerja per SATU pengajuan (boleh ajukan lagi terpisah kalau butuh lebih & saldo masih ada)"
    hari_bisa_dipilih: "Senin–Sabtu (hitungan hari kerja)"
    hari_tidak_bisa_dipilih: "Minggu + hari besar/libur nasional (otomatis di-disable di kalender)"
  efek_ke_upah: "Cuti disetujui → dibayar, potong saldo. Cuti Khusus → dibayar, TIDAK potong saldo tahunan"
  mockup_reference: "mockup_personal_data_selfservice.html tab 'Cuti/Sakit/Izin' — kalender kustom (bukan native date input) yg scara visual mendemokan H+7 disabled + Minggu/hari besar merah-tercoret + limit klik maks 3 hari"
  delta_pending: "Perhitungan akrual proporsional (pegawai baru <1 tahun), carryover sisa cuti tahun lalu, dan cuti khusus per-jenis jumlah hari — BELUM didetailkan, baru kerangka aturan dasar"

# ═══════════════════════════════════════════════════════════════════
# SOP PERIZINAN RESMI — SUMBER OTORITATIF (BARU, 2026-08-18)
# Dokumen: SOP_PERIZINAN_KARYAWAN_TELASIH_MAKMUR.pdf
# No. 002/RP/TM/VII/2026, efektif 6 Juli 2026, ditandatangani HR/Ops
# Manager/GM/Direktur Utama. INI ADALAH ATURAN RESMI PERUSAHAAN —
# menggantikan/mengoreksi asumsi desain sebelumnya bila bertentangan.
# ═══════════════════════════════════════════════════════════════════
sop_perizinan_resmi:
  status: "SUMBER OTORITATIF. Beberapa poin MENGOREKSI keputusan sebelumnya di cuti_engine/self_service_katalog — lihat perubahan_dari_desain_sebelumnya di bawah"

  definisi_6_jenis_ketidakhadiran:
    - "Sakit — dibuktikan surat sakit dari dokter resmi + resep obat/kwitansi"
    - "Izin — HANYA utk karyawan yg TIDAK punya jatah cuti atau jatah cuti sudah habis. Diajukan H-7, ATAU pada hari-H khusus kondisi musibah"
    - "Cuti — maksimal pengajuan H-7"
    - "Alpha — tidak masuk tanpa keterangan dan/atau tanpa persetujuan atasan"
    - "Tukar Shift — dgn persetujuan atasan, pengajuan maks H-1 (BUKAN H-7)"
    - "Keluar pada Jam Kerja — harus persetujuan atasan (Surat Izin Keluar)"

  perubahan_dari_desain_sebelumnya:
    - "[KOREKSI PENTING] IZIN TIDAK BEBAS DIPILIH kapan saja. Karyawan HANYA boleh ajukan Izin jika saldo cuti tahun berjalan SUDAH HABIS (0 hari). Selama masih ada saldo cuti, ketidakhadiran non-sakit WAJIB pakai Cuti (dibayar, potong saldo), BUKAN Izin. Portal self-service harus validasi: jika saldo_cuti > 0, opsi 'Izin' di-disable/diberi warning + saran pakai Cuti"
    - "[KOREKSI] Sakit butuh 2 dokumen wajib: (1) Surat Keterangan Dokter (SKD), (2) Kwitansi pemeriksaan/resep obat/bukti pembelian obat — bukan cuma 'surat dokter' generik. Alternatif: screenshot riwayat pendaftaran+diagnosis+obat dari aplikasi JKN (bagi peserta BPJS via Faskes 1)"
    - "[BARU] Sakit wajib lapor ke atasan+HRD PALING LAMBAT PUKUL 07.30 WIB pada hari ketidakhadiran (deadline jam spesifik, sebelumnya tidak ada)"
    - "[BARU] Tukar Shift deadline = H-1 (bukan mengikuti pola H+7 cuti). Wajib isi 'Form Tukar Shift'"
    - "[BARU] Izin Mendadak HANYA sah dlm 3 kategori spesifik (lihat izin_mendadak_kategori) — bukan izin mendadak bebas alasan apapun"
    - "[BARU] Konsep 'Keluar pada Jam Kerja' (Surat Izin Keluar) — modul BARU, belum ada sebelumnya di desain kita"
    - "[BARU] Konsekuensi Alpha & eskalasi SP1/SP2/SP3 — detail lengkap, perlu tabel emp_disciplinary yg SEBELUMNYA cuma ada di mockup UI, BELUM ada DDL-nya"

  ketentuan_sakit:
    dokumen_wajib: ["Surat Keterangan Dokter (SKD)", "Kwitansi pemeriksaan ATAU resep obat ATAU bukti pembelian obat"]
    alternatif_bpjs_jkn: "Peserta BPJS yg berobat ke Faskes 1 via app JKN boleh kirim screenshot riwayat pendaftaran+diagnosis+obat yg diresepkan, sbg pengganti dokumen fisik"
    deadline_lapor: "Paling lambat pukul 07.30 WIB pada hari ketidakhadiran, ke atasan DAN HRD"
    deadline_dokumen: "Paling lambat hari-H saat masuk kerja kembali"
    konsekuensi_dokumen_tidak_lengkap_atau_telat: "Ketidakhadiran DICATAT SEBAGAI IZIN (bukan Sakit)"
    aturan_anti_penyalahgunaan: "Wajib lampirkan SKD jika: (a) sakit LEBIH dari 1 hari, ATAU (b) sakit di hari yg berurutan dgn Hari Minggu/tanggal merah (sebelum/sesudah). Tanpa SKD pada kondisi ini → teguran verbal (mencegah pola 'sakit' memperpanjang libur panjang)"

  ketentuan_izin_terjadwal:
    syarat_boleh_ajukan: "HANYA jika saldo cuti tahun berjalan sudah HABIS — lihat perubahan_dari_desain_sebelumnya"
    deadline_pengajuan: "Minimal H-7 sebelum tanggal pelaksanaan (jika sudah diketahui sebelumnya)"
    batas_hari_berturut: "Maksimal 3 hari berturut-turut per pengajuan. Lebih dari itu, hari ke-4 dst DIANGGAP ALPHA"
