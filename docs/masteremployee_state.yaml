# ═══════════════════════════════════════════════════════════════════
# masteremployee_state.yaml — PROGRESS MODUL Master Employee + Personal Self-Service (HRM, subset)
# Menunjuk ke globalrules.yaml. Modul baru — dibuat 2026-08-15, dirangkum ulang lengkap 2026-08-18.
# Catatan: HR (recruitment/attendance/payroll) TETAP ditunda (GLOBAL_START_HERE.
#          modules_excluded.hr). Modul ini pengecualian eksplisit: Master Employee
#          (org_*/emp_*) untuk login+signature lintas modul, DIPERLUAS mencakup
#          portal self-service karyawan (pengajuan cuti/sakit/izin/koreksi data/dst)
#          karena user eksplisit minta engine cuti dibangun sekarang.
# ═══════════════════════════════════════════════════════════════════

meta:
  modul: "HRM — Master Employee + Personal Self-Service (subset dari HR yang ditunda)"
  status: "SPEC LENGKAP & SINKRON (Tier 1/2/3A/4 + mockup) — DIPERBARUI 2026-08-18 dgn SOP Perizinan resmi (002/RP/TM/VII/2026). Belum diimplementasi Claude Code. Review Telma diperlukan sebelum eksekusi, KHUSUSNYA validasi ulang aturan SOP baru"
  lihat_global: "globalrules.yaml untuk konvensi umum"
  file_terkait:
    - "masteremployee_tier1.md — business requirements (SINKRON 2026-08-18)"
    - "masteremployee_tier2.md — business logic Part A/B/C (SINKRON 2026-08-18)"
    - "TIER_3A_HRM.sql — DDL 25 tabel (org_*, emp_* di tm2mst) (SINKRON 2026-08-18, termasuk BPJS/self-service request/machine spec/shift roster batch)"
    - "masteremployee_tier4.md — wireframe & binding table, 4 file mockup (SINKRON 2026-08-18)"
    - "selfservice_panduan.md — dokumen baca non-teknis: katalog lengkap semua jenis pengajuan self-service + alur approval"
  mockup_files:
    - "mockup_master_employee_hr.html — panel HR Admin: Master Employee (list+detail 8 subtab), Struktur Organisasi, Kedisiplinan, KPI, Dokumen Kedaluwarsa (dashboard lintas-karyawan), Approval Sakit/Izin/Cuti, Approval Koreksi Data. Role simulator (HR Officer/Admin App) di sidebar"
    - "mockup_master_produksi.html — TERPISAH dari HR: Master Mesin (spec lengkap) + Master Shift (jam per hari + istirahat). Klik baris = modal editable"
    - "mockup_personal_data_selfservice.html — portal karyawan (mobile-first, hanya login sendiri): 7 tab — Data Saya, Keluarga & Status, Dokumen & Pendidikan, Cuti/Sakit/Izin, Tukar Shift, Jadwal Saya, Kartu Pengenal"
  catatan_kelengkapan_mockup: "Tombol Ganti/Upload dokumen (NPWP/SIM/KTP/foto badge) SUDAH interaktif (modal+preview file). Tombol Edit lain (Kontrak/Keluarga/Rekening/Kedisiplinan/KPI/tree org) SENGAJA dekoratif — sesuai definisi mockup di globalrules.yaml (replikasi struktur, bukan prototype penuh)"

# ═══════════════════════════════════════════════════════════════════
# KEPUTUSAN ARSITEKTUR TERKUNCI — MASTER EMPLOYEE (HR Admin)
# ═══════════════════════════════════════════════════════════════════
keputusan_terkunci:
  scope: "HANYA master employee (org_*/emp_*) + portal self-service. Recruitment(tm2hrr)/Payroll(tm2pyr) penuh/Attendance mesin TETAP ditunda — kecuali engine cuti (lihat cuti_engine) yg eksplisit diminta dibangun"
  company_mode: "1 CV (belum PT) dgn 3 SBU/divisi: Offset Printing, Digital Printing, Indostry. org_company=1 baris, org_division=3 baris"
  employment_status: "4 tipe: TETAP, KONTRAK, HARIAN, BORONGAN (emp_contract.employment_type). PROBATION = flag is_probation+probation_end_date di emp_contract (BUKAN tipe baru). DIRUMAHKAN = field work_status di emp_employee (BUKAN tipe kontrak)"
  db_location: "org_*/emp_* di tm2mst (master netral), BUKAN tm2hrm"
  lifecycle: "TANPA approval workflow utk data master — HR full-editable. ACTIVE ⇄ INACTIVE (resign+alasan wajib)"
  auth_link: "users.employee_id NOT NULL — user HARUS dibuat dari layar detail employee"
  employee_code_format: "{company_code}-{sequence 5 digit}, per-company"
  versioned_pattern: "emp_contract & emp_bank_account.is_primary pakai pola 1-aktif-per-employee"
  machine_scope: "HANYA Offset Printing pakai assignment mesin presisi. Digital Printing & Indostry pakai grid HR sederhana"
  default_machine_shift: "emp_employee.default_machine_id/default_shift_id = OPSIONAL, prefill saja, TIDAK mengunci"
  roster_conflict_rule: "2 tingkat: HARD (1 org, mesin beda, shift+tgl sama → tolak) vs SOFT (1 org, shift beda, hari sama → boleh+flag oranye)"
  overtime_fields: "emp_shift_roster.is_overtime + overtime_type (REGULER/HARI_MINGGU/HARI_BESAR) menyatu di baris roster"
  org_department_shared: "org_department.division_id NULLABLE — departemen shared (Security, Staff/Admin) nempel langsung company. company_id WAJIB selalu"
  emp_type_deprecated: "Master emp_type LEGACY di-DROP, digantikan org_department/org_position. Mapping lihat migration_mapping_m_shifts"
  shift_structure_revised: "emp_shift = HEADER (shift_id, department_id, shift_name) + DETAIL emp_shift_detail (day_of_week Monday-Sunday, start_time, break_out, break_in, end_time). Shift beda jam per hari + ada istirahat. Hari tak diisi = tidak beroperasi (valid)"
  machine_spec_fields: "prod_machine tambah kolom: machine_type (Cetak/Coating/Laminasi/Potong), brand_model, year, serial_no, max_paper_size, color_count, max_speed(sheet/jam), capacity_per_shift, gsm_min, gsm_max, notes — SEMUA dipilih user, [DELTA] belum masuk TIER_3A_HRM.sql, baru di mockup"
  employee_header_status_display: "Di detail HR Admin, header nama menampilkan baris status kepegawaian dinamis: PROBATION → 's/d {probation_end_date}' + info kontrak; KONTRAK/HARIAN/BORONGAN → 'Berakhir {contract end_date}'; TETAP → tanpa tanggal (tidak berbatas waktu). Field tambahan: Agama, Tanggal Lahir (keduanya editable HR, dan bisa diajukan koreksi dari self-service — Tanggal Lahir wajib approval HR krn sensitif)"

# ═══════════════════════════════════════════════════════════════════
# ROLE-BASED ACCESS — HR OFFICER vs ADMIN APP (BARU)
# ═══════════════════════════════════════════════════════════════════
role_access_control:
  akun_tab_restriction: "Sub-tab 'Akun' (create/reset password/nonaktifkan login) di detail employee HANYA terlihat & bisa diakses oleh role Admin App. HR Officer TIDAK BERHAK mengelola akun login karyawan — murni urusan sistem/IT, di luar wewenang administrasi kepegawaian HR"
  gaji_visibility_rule: |
    Aturan visibilitas gaji di tab Kontrak (HR Admin):
    1. HR Officer HANYA bisa lihat gaji jika employment_type = KONTRAK atau BORONGAN.
       Gaji TETAP/HARIAN disembunyikan dari HR Officer secara default.
    2. TERLEPAS dari tipe kontrak, gaji level jabatan tertentu SELALU disembunyikan
       dari HR Officer (usulan Claude, PERLU KONFIRMASI Telma):
       Direksi, General Manager, Manager, Operational Manager.
    3. Role Admin App selalu bisa lihat semua gaji tanpa masking.
  gaji_visibility_status: "[DELTA — PERLU KONFIRMASI] Daftar level yg gajinya dirahasiakan dari HR (Direksi/GM/Manager/Ops Manager) adalah usulan, belum final. Disarankan implementasi sbg tabel konfigurasi (mis. org_position.salary_hidden_from_hr boolean atau job_level lookup), BUKAN hardcode di kode aplikasi — supaya HR/Direksi bisa ubah kebijakan tanpa ubah kode"
  mockup_reference: "mockup_master_employee_hr.html punya role simulator toggle (HR Officer/Admin App) di sidebar utk demo perilaku ini — termasuk data 8 karyawan contoh (1 level Manager: Bambang Wijaya, utk demo masking)"

# ═══════════════════════════════════════════════════════════════════
# BPJS — DATA MASTER KEPESERTAAN (BARU)
# ═══════════════════════════════════════════════════════════════════
bpjs:
  scope_boundary: "HANYA simpan status kepesertaan & skema iuran sbg REFERENSI/data master. Perhitungan potongan gaji aktual = ranah modul Payroll (scope DIBUKA 2026-08-26, lihat globalstarthere.md → DEC-SCOPE-OPEN — tapi tetap modul TERPISAH). JANGAN bangun engine hitung potongan DI SINI (HRM); itu tetap punya modul Payroll sendiri, sekarang boleh mulai dikerjakan"
  bpjs_kesehatan:
    fields: "no_kepesertaan, kelas_rawat (I/II/III), status (aktif/nonaktif), jumlah_tanggungan_terdaftar"
    skema_iuran_referensi: "Perusahaan 4% + Karyawan 1% (potong gaji) dari upah — sesuai regulasi berlaku saat ini, BISA BERUBAH ikut aturan pemerintah"
  bpjs_ketenagakerjaan:
    fields: "no_kepesertaan, status, dan per-program: JKK, JKM, JHT, JP, JKP"
    skema_iuran_referensi:
      - "JKK (Kecelakaan Kerja): 100% perusahaan (0,24–1,74% sesuai kelas risiko)"
      - "JKM (Kematian): 100% perusahaan (0,3%)"
      - "JHT (Hari Tua): Perusahaan 3,7% + Karyawan 2%"
      - "JP (Pensiun): Perusahaan 2% + Karyawan 1%"
      - "JKP (Kehilangan Pekerjaan): 0,22% perusahaan + subsidi pemerintah, tanpa potongan karyawan"
  edit_authority: "Status kepesertaan & program dikelola HR (subtab BPJS di HR Admin). Karyawan di portal self-service hanya bisa AJUKAN KOREKSI nomor kepesertaan (typo), tidak bisa ubah status/program sendiri"

# ═══════════════════════════════════════════════════════════════════
# DOKUMEN KEDALUWARSA — MONITORING (BARU)
# ═══════════════════════════════════════════════════════════════════
dokumen_kedaluwarsa:
  kebutuhan: "Dashboard HR lintas-karyawan (bukan cuma per-karyawan) menampilkan dokumen legal yg sudah/segera kedaluwarsa (Passport, SIM, SKCK, dst) — utk kepentingan kepatuhan & administrasi kantor"
  mockup_location: "mockup_master_employee_hr.html → nav 'Dokumen Kedaluwarsa' (grup Monitoring). Stat ringkas (sudah kedaluwarsa/segera ≤30 hari/menunggu review perpanjangan) + tabel filter + tombol 'Ingatkan Karyawan' (kirim notifikasi via modul 08_security/notification)"
  catatan_ktp: "[KOREKSI FAKTUAL] e-KTP WNI berlaku SEUMUR HIDUP sejak aturan Kemendagri 2011 — field expiry_date utk KTP dibuat OPSIONAL/nullable, tidak semua karyawan akan punya tanggal kedaluwarsa KTP. Tetap berguna utk kasus khusus (WNA dgn KITAS/KITAP, atau format KTP lama)"

# ═══════════════════════════════════════════════════════════════════
# FOTO BADGE / KARTU PENGENAL — KETENTUAN PENGAJUAN (BARU)
