foto_badge:
  alur: "Karyawan AJUKAN foto baru dari portal self-service (tab Kartu Pengenal) — TIDAK langsung mengganti. Berlaku setelah disetujui HR dan dicetak ulang oleh HR"
  ketentuan_ukuran:
