<svg viewBox="0 0 680 430" width="680" height="430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl">
<title id="ttl">Alur Planning Produksi: dari susunan officer sampai usulan urutan ML</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.t{font-size:14px}
.ts{font-size:12px}
.th{font-size:14px;font-weight:600}
.arr{stroke:#000;stroke-width:1.5;fill:none}
rect{stroke-width:1.2}
.c-blue rect{fill:#dbeafe;stroke:#1d4ed8}
.c-amber rect{fill:#fef3c7;stroke:#b45309}
.c-green rect{fill:#dcfce7;stroke:#15803d}
.c-purple rect{fill:#ede9fe;stroke:#6d28d9}
.c-teal rect{fill:#ccfbf1;stroke:#0f766e}
.c-red rect{fill:#fee2e2;stroke:#b91c1c}
.c-coral rect{fill:#ffe4d6;stroke:#c2410c}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="430" fill="#fff" stroke="none"/>
<text class="th" x="20" y="22">Alur Planning Produksi: dari susunan officer sampai usulan urutan ML</text>
<g class="c-blue"><rect x="20" y="40" width="180" height="80" rx="8"/><text class="th" x="110" y="68" text-anchor="middle">1. Officer menyusun</text><text class="t" x="110" y="88" text-anchor="middle">Simulation: tukar urutan</text><text class="t" x="110" y="106" text-anchor="middle">bebas (job DRAFT)</text></g>
<g class="c-amber"><rect x="250" y="40" width="180" height="80" rx="8"/><text class="th" x="340" y="68" text-anchor="middle">2. Bahan baku siap?</text><text class="t" x="340" y="88" text-anchor="middle">Semua bahan job harus</text><text class="t" x="340" y="106" text-anchor="middle">tersedia, kalau tidak: tolak</text></g>
<g class="c-green"><rect x="480" y="40" width="180" height="80" rx="8"/><text class="th" x="570" y="68" text-anchor="middle">3. APPLY ke Live</text><text class="t" x="570" y="88" text-anchor="middle">Job jadi LIVE, terkunci,</text><text class="t" x="570" y="106" text-anchor="middle">tidak bisa digeser lagi</text></g>
<line class="arr" x1="200" y1="80" x2="248" y2="80" marker-end="url(#ah)"/>
<line class="arr" x1="430" y1="80" x2="478" y2="80" marker-end="url(#ah)"/>
<text class="ts" x="455" y="72" text-anchor="middle">siap</text>
<g class="c-purple"><rect x="480" y="170" width="180" height="80" rx="8"/><text class="th" x="570" y="198" text-anchor="middle">4. Urutan live dicatat</text><text class="t" x="570" y="218" text-anchor="middle">Posisi tiap job di antrean</text><text class="t" x="570" y="236" text-anchor="middle">mesin saat APPLY</text></g>
<g class="c-purple"><rect x="250" y="170" width="180" height="80" rx="8"/><text class="th" x="340" y="198" text-anchor="middle">5. ML belajar</text><text class="t" x="340" y="218" text-anchor="middle">Mempelajari pola urutan</text><text class="t" x="340" y="236" text-anchor="middle">buatan officer</text></g>
<g class="c-teal"><rect x="20" y="170" width="180" height="80" rx="8"/><text class="th" x="110" y="198" text-anchor="middle">6. ML beri usulan</text><text class="t" x="110" y="218" text-anchor="middle">Baris usulan di Simulation</text><text class="t" x="110" y="236" text-anchor="middle">dan QUE, officer boleh tolak</text></g>
<line class="arr" x1="570" y1="120" x2="570" y2="168" marker-end="url(#ah)"/>
<line class="arr" x1="480" y1="210" x2="432" y2="210" marker-end="url(#ah)"/>
<line class="arr" x1="250" y1="210" x2="202" y2="210" marker-end="url(#ah)"/>
<line class="arr" x1="110" y1="170" x2="110" y2="122" marker-end="url(#ah)"/>
<text class="ts" x="122" y="150">usulan dipakai atau ditolak</text>
<g class="c-red"><rect x="20" y="310" width="250" height="80" rx="8"/><text class="th" x="145" y="338" text-anchor="middle">Job bermasalah atau</text><text class="th" x="145" y="358" text-anchor="middle">mesin jam/rusak</text><text class="t" x="145" y="378" text-anchor="middle">(contoh: laminasi)</text></g>
<g class="c-coral"><rect x="360" y="310" width="300" height="80" rx="8"/><text class="th" x="510" y="338" text-anchor="middle">Live Schedule ambil job</text><text class="th" x="510" y="358" text-anchor="middle">berikutnya yang siap</text><text class="t" x="510" y="378" text-anchor="middle">mesin tetap jalan</text></g>
<line class="arr" x1="270" y1="350" x2="358" y2="350" marker-end="url(#ah)"/>
<line class="arr" x1="570" y1="310" x2="570" y2="252" marker-end="url(#ah)"/>
<text class="ts" x="558" y="284" text-anchor="end">juga dicatat jadi bahan ML</text>
</svg>
