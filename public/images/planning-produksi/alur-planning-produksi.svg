<svg viewBox="0 0 680 880" width="680" height="880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl">
<title id="ttl">Alur Planning Produksi v2: PROCESS, APPLY, dan ML, lengkap dengan tabel penyimpanan</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.t{font-size:14px}
.ts{font-size:12px}
.th{font-size:14px;font-weight:600}
.arr{stroke:#000;stroke-width:1.5;fill:none}
rect{stroke-width:1.2}
.c-blue rect{fill:#dbeafe;stroke:#1d4ed8}
.c-amber rect{fill:#fef3c7;stroke:#b45309}
.c-green rect{fill:#dcfce7;stroke:#15803d}
.c-purple rect{fill:#ede9fe;stroke:#6d28d9}
.c-teal rect{fill:#ccfbf1;stroke:#0f766e}
.c-red rect{fill:#fee2e2;stroke:#b91c1c}
.c-slate rect{fill:#f1f5f9;stroke:#475569}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="880" fill="#fff" stroke="none"/>
<text class="th" x="20" y="22">Alur Planning Produksi v2: PROCESS, APPLY, dan ML</text>
<g class="c-blue"><rect x="20" y="40" width="200" height="64" rx="8"/><text class="th" x="120" y="66" text-anchor="middle">1. Officer menyusun</text><text class="ts" x="120" y="86" text-anchor="middle">Simulation, tukar job DRAFT</text></g>
<g class="c-amber"><rect x="240" y="40" width="200" height="64" rx="8"/><text class="th" x="340" y="66" text-anchor="middle">2. Klik PROCESS</text><text class="ts" x="340" y="86" text-anchor="middle">tombol di top bar Form WO</text></g>
<g class="c-green"><rect x="460" y="40" width="200" height="64" rx="8"/><text class="th" x="560" y="66" text-anchor="middle">3. Hasil PROCESS</text><text class="ts" x="560" y="86" text-anchor="middle">lulus: APPLY aktif; BLOCK: mati</text></g>
<line class="arr" x1="220" y1="72" x2="238" y2="72" marker-end="url(#ah)"/>
<line class="arr" x1="440" y1="72" x2="458" y2="72" marker-end="url(#ah)"/>
<line class="arr" x1="340" y1="104" x2="340" y2="128" marker-end="url(#ah)"/>
<g class="c-slate"><rect x="20" y="130" width="640" height="352" rx="10"/><text class="th" x="36" y="152">Di balik PROCESS (berjalan di latar) dan tempat penyimpanannya</text></g>
<g class="c-teal"><rect x="40" y="165" width="340" height="38" rx="6"/><text class="t" x="54" y="189">a. Bangun ulang BOP dari ProDev (engine BOP)</text><rect x="400" y="165" width="240" height="38" rx="6"/><text class="ts" x="412" y="181">prd_wo_operation</text><text class="ts" x="412" y="196">operasi tiap proses (BOP)</text></g>
<g class="c-teal"><rect x="40" y="209" width="340" height="38" rx="6"/><text class="t" x="54" y="233">b. Bangun ulang BOM, cek stok tersedia</text><rect x="400" y="209" width="240" height="38" rx="6"/><text class="ts" x="412" y="225">prd_wo_material</text><text class="ts" x="412" y="240">Required, Release, Purchase</text></g>
<g class="c-teal"><rect x="40" y="253" width="340" height="38" rx="6"/><text class="t" x="54" y="277">c. Hitung target, waste, setup</text><rect x="400" y="253" width="240" height="38" rx="6"/><text class="ts" x="412" y="269">prd_wo_operation</text><text class="ts" x="412" y="284">target, waste, setup</text></g>
<g class="c-teal"><rect x="40" y="297" width="340" height="38" rx="6"/><text class="t" x="54" y="321">d. Cek gate: bahan baku dan tooling</text><rect x="400" y="297" width="240" height="38" rx="6"/><text class="ts" x="412" y="313">prd_wo_operation.gate_*</text><text class="ts" x="412" y="328">bahan, tooling: READY, WAIT, BLOCK</text></g>
<g class="c-teal"><rect x="40" y="341" width="340" height="38" rx="6"/><text class="t" x="54" y="365">e. Susun jadwal Draft per mesin</text><rect x="400" y="341" width="240" height="38" rx="6"/><text class="ts" x="412" y="357">prd_wo_operation.draft_*</text><text class="ts" x="412" y="372">mesin, start, finish (Draft)</text></g>
<g class="c-teal"><rect x="40" y="385" width="340" height="38" rx="6"/><text class="t" x="54" y="409">f. Simpan sidik PROCESS (data berubah?)</text><rect x="400" y="385" width="240" height="38" rx="6"/><text class="ts" x="412" y="401">prd_wo.process_hash</text><text class="ts" x="412" y="416">sidik data + processed_at</text></g>
<g class="c-purple"><rect x="40" y="429" width="340" height="38" rx="6"/><text class="t" x="54" y="453">g. ML catat urutan sebagai PERCOBAAN</text><rect x="400" y="429" width="240" height="38" rx="6"/><text class="ts" x="412" y="445">prd_plan_trace (baru)</text><text class="ts" x="412" y="460">status TRIAL, bobot latih 0</text></g>
<line class="arr" x1="210" y1="482" x2="210" y2="508" marker-end="url(#ah)"/>
<text class="ts" x="222" y="500">lulus: tanpa BLOCK, bahan siap</text>
<g class="c-green"><rect x="40" y="510" width="340" height="90" rx="8"/><text class="th" x="54" y="534">4. APPLY ke Live Schedule</text><text class="ts" x="54" y="554">Aktif hanya setelah PROCESS lulus dan bahan</text><text class="ts" x="54" y="570">siap. Job jadi LIVE, terkunci.</text><text class="ts" x="54" y="586">Data berubah: klik PROCESS lagi.</text>
<rect x="400" y="510" width="240" height="90" rx="8"/><text class="ts" x="412" y="530">prd_wo_operation: is_locked</text><text class="ts" x="412" y="546">prd_wo.wo_status = SCHEDULED</text><text class="ts" x="412" y="562">prd_plan_run, prd_plan_decision</text><text class="ts" x="412" y="578">prd_plan_trace: FINAL (label ML)</text></g>
<line class="arr" x1="210" y1="600" x2="210" y2="632" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="40" y="634" width="340" height="60" rx="8"/><text class="th" x="54" y="658">5. ML belajar dari urutan FINAL</text><text class="ts" x="54" y="678">Pairwise ranking, jalan harian (sequence:train)</text>
<rect x="400" y="634" width="240" height="60" rx="8"/><text class="ts" x="412" y="660">prd_sequence_model (baru)</text><text class="ts" x="412" y="676">bobot, versi, AKTIF atau BEKU</text></g>
<line class="arr" x1="210" y1="694" x2="210" y2="726" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="40" y="728" width="340" height="64" rx="8"/><text class="th" x="54" y="752">6. ML beri usulan urutan</text><text class="ts" x="54" y="772">Di Simulation dan QUE, officer boleh tolak</text>
<rect x="400" y="728" width="240" height="64" rx="8"/><text class="ts" x="412" y="748">Dismiss tercatat SEQ_REJECT</text><text class="ts" x="412" y="764">(prd_plan_decision)</text><text class="ts" x="412" y="780">lalu kembali ke langkah 1</text></g>
<g class="c-red"><rect x="20" y="812" width="640" height="52" rx="8"/><text class="th" x="36" y="834">Job bermasalah atau mesin jam/rusak (contoh: laminasi)</text><text class="ts" x="36" y="852">Live Schedule ambil job berikutnya yang siap, dicatat jadi bahan ML</text></g>
</svg>
