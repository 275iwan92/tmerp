# Manifest komponen Blade TMERP — BACA INI, bukan file komponennya satu per satu.
# Format: tag -> props (default), slot, catatan. Semua komponen = anonymous Blade
# (resources/views/components/**). $attributes (wire:model, wire:change, class,
# disabled, dll) diteruskan ke elemen input asli kecuali disebut lain.
# Wajib diperbarui saat menambah/mengubah props komponen.

gotchas:
  - "Prop null dibuang diam-diam oleh @props -> pakai false/'' (mis. :placeholder=\"false\")."
  - "Jangan tulis tag komponen berkurung sudut di komentar Blade apa pun (ikut terkompilasi)."
  - "Jangan @php inline di dalam @if/@foreach; @php(...) inline wajib ada penutup."
  - "<select> + wire:model rawan bug morph Livewire v4 -> x-form.select liveSync / toggle-group / searchable-select."
  - "Class .grid global (app.css) memaksa 4 kolom -> pakai 'grid two'/'grid three' atau flex, bukan grid-cols-N."
  - "Komponen berbasis Alpine (date-picker, searchable-select, multi-select, dll) bind lewat input hidden; nilai tanggal selalu ISO."
  - "Teks UI lewat App\\Support\\Localization\\Translator::t('key', 'Fallback ID')."
  - "Input teks string WAJIB x-form.input/textarea (badge huruf aa/Aa/AA ikut otomatis) + lookup kalau nilainya sudah ada di master -- FORM_UI_STANDARD 1b."
  - "Warna field: border-field-border/bg-field-soft/bg-field-badge/bg-accent-soft (token @theme app.css), JANGAN hex abu-abu literal -- supaya ikut corak sys_theme."
  - "Tombol baku: Simpan/Batal/Tutup (ID), Back selalu Inggris. Grid: '+ New Record'."

ui: # Layer 1 PRIMITIVE (class PHP app/View/Components/Ui, turunan UiComponent) -- docs/componentstandard.md
  # Pakai ini SEBELUM menulis <button>/<span badge>/<table>/modal mentah. Warna dari token @theme, bukan hex.
  x-ui.button: {props: {variant: "primary|secondary|neutral|navy|success|danger|outline|ghost|link|chip|action|action-danger|action-success|action-plain*", size: "md|sm|xs|square", preset: "save|cancel|close|confirm|apply|delete|new (label+variant+type terkunci)", type: "null=ikut preset/button", href: "null -> <a>", icon: "fa-xxx", iconRight: null, active: "false (utk chip)", block: false}, slot: "label (mengalahkan preset)"}
  x-ui.icon-button: {props: {icon: req, variant: ghost, size: "md|sm|xs", type: null, href: null, active: false}, note: "turunan Button"}
  x-ui.badge: {props: {tone: "neutral|muted|code|accent|info|success|warn|danger|highlight|extra", size: "sm|xs|md", pill: false, mono: false, icon: null}}
  x-ui.badge-button: {props: "sama dgn x-ui.badge", note: "badge yg bisa diklik (toggle di baris tabel)"}
  x-ui.card: {props: {variant: "section|panel|muted|plain", size: "md|sm|none", title: null, description: "teks polos"}, slots: "intro (teks kaya), actions (kanan judul), default"}
  x-ui.tabs: {props: {tabs: "[key=>label]", active: req, model: "nama properti -> \$set(model,key)", badges: "[key=>[text,tone]]"}}
  x-ui.table: {props: {size: "md|sm", framed: false, sticky: false, hover: false}, note: "th/td polos otomatis bergaya (.tm-table @layer components); class per sel utk lebar/align saja"}
  x-ui.modal: {props: {title: null, close: "ekspresi wire:click penutup", size: "xs|sm|md|lg|xl|2xl"}, slots: "default, header, footer", note: "tampil/tidak diatur @if di pemanggil"}
  x-ui.progress: {props: {value: "0-100", tone: info, marker: "null|0-100", markerTitle: null, min: 0}}
  x-ui.metric: {props: {label: null, hint: null, tone: neutral, size: "sm|lg", emphasis: false}, slots: "default = nilai, footer"}
  x-ui.panel-header: {props: {title: null, variant: "navy|light"}, slots: "aside"}
  x-ui.action-bar: {props: {variant: "footer|inline|end"}, note: "footer = strip bawah form p-5"}
  x-ui.window: {props: {open: "nama flag Alpine di shell (req, mis. configWinOpen)", id: "req, unik", title: null, icon: null, width: 720, height: 500}, slot: "isi jendela", note: "geser/perkecil(dok)/perbesar/tutup -- resources/js/ui-window.js; flag baru wajib didaftarkan di appShell+reportShell (app-shell.js). Dipakai menu profil (sys_user_menu action_type modal)."}
  Tone: "App\\View\\Components\\Ui\\Tone::soft|solid|text(tone), ::forScore(nilai, good=80, fair=50)"

tones: # palet bersama, jangan bikin warna baru
  form.badge: [default, active|success, warn, danger, info, extra]
  grid.stat-box: [total, active, extra, critical, warn]
  report.kpi: [blue, green, amber, violet, danger]

form: # dialek default Tailwind; legacy=true|'namaClass' untuk CSS lama (.f/.fld)
  x-form.input: {props: {label: null, name: null, type: text, hint: null, error: 'null (fallback $errors->first(name))', legacy: false, col2: false, col3: false, col4: false, caseToggle: true, caseMode: none}, note: "type=text OTOMATIS dapat badge huruf aa/Aa/AA (WAJIB, FORM_UI_STANDARD 1b); mati sendiri utk readonly/disabled/type lain; :case-toggle=false hanya utk kotak cari"}
  x-form.textarea: {props: {label: null, name: null, hint: null, error: null, legacy: false, col2/col3/col4: false, autogrow: false, caseToggle: true, caseMode: none}, slot: "label (named, opsional)", note: "badge huruf sama dgn x-form.input"}
  x-form.select: {props: {label: null, name: null, options: "[value=>label]", selected: null, placeholder: "null=default '— pilih —', false=tanpa", error: null, legacy: false, col2: false, liveSync: false}}
  x-form.searchable-select: {props: {label: null, name: null, options: "[string]", placeholder: null, value: ''}}
  x-form.multi-select: {props: {label: null, name: null, options: [], selected: [], placeholder: null, value: ''}}
  x-form.date-picker: {props: {label: null, name: null, mode: "date|datetime", hint: null, error: null, legacy: false, col2: false, min: "Y-m-d", max: "Y-m-d"}, note: "pengganti wajib input type=date"}
  x-form.date-range: {props: {label: null, startName: null, endName: null, startLabel: Mulai, endLabel: Selesai}}
  x-form.checkbox: {props: {label: null, labelClass: text-muted}, slot: "default (label kaya, opsional)"}
  x-form.switch: {props: {label: null, onLabel: Aktif, offLabel: Nonaktif, checked: false}}
  x-form.radio-group: {props: {label: null, name: null, options: "[value=>label]", selected: null}}
  x-form.toggle-group: {props: {label: null, hint: null, legacy: false, col2: false}, slot: "x-form.toggle-option"}
  x-form.toggle-option: {props: {active: false, legacy: false}, slot: label, example: "wire:click=\"setX('A')\""}
  x-form.number-stepper: {props: {label: null, name: null, min: null, max: null, value: 0}}
  x-form.decimal-input: {props: {label: null, name: null, unit: null, decimals: 2, value: '', hint: null}}
  x-form.currency-input: {props: {label: null, name: null, currencies: [], value: '', hint: null}}
  x-form.masked-input: {props: {label: null, name: null, segments: "[6,6,4]", separator: '.', hint: null, error: null, value: ''}, note: "mis. NIK"}
  x-form.phone-input: {props: {label: null, name: null, countries: [], value: '', hint: null, error: null}}
  x-form.password-input: {props: {label: null, name: null, hint: null, error: null}}
  x-form.case-toggle-input: {props: {label: null, name: null, placeholder: null, hint: null, error: null, value: ''}}
  x-form.otp-input: {props: {label: null, name: null, length: 6}}
  x-form.range-slider: {props: {label: null, min: 0, max: 100, step: 1, value: 0, format: null, unit: ''}}
  x-form.star-rating: {props: {label: null, name: null, max: 5, value: 0}}
  x-form.color-picker: {props: {label: null, value: '#2563eb'}}
  x-form.file-dropzone: {props: {label: null, name: null, hint: null, accept: null, currentName: null}}
  x-form.display: {props: {label: required}, slot: "nilai read-only"}
  x-form.badge: {props: {tone: default}, slot: teks status}
  x-form.auto-chip: {props: {state: "auto|override|null", field: "null = legenda; diisi -> chip override klik = resetAuto(field)"}, note: "penanda field terisi otomatis (Quotation), taruh absolute top-0 right-0 di wrapper relative"}
  x-form.split-button: {props: {label: Simpan, icon: '💾', actions: []}}
  x-form.mini-calendar: {props: {events: []}}

layout:
  x-back-button: {props: {fallback: "route grid (wajib)"}, attrs: "title, class", note: "Back = layar sebelumnya via dirty-guard.js"}
  x-alert.banner: {props: {type: "info|success|danger|warn", message: "null = tidak tampil"}}
  x-alert.toast: {}
  x-ui.accordion: {props: {title: required, count: null, open: false, tone: slate}}

grid: # pasangkan dengan trait App\Livewire\Concerns\HasCustomizableGrid
  x-grid.stat-filter-row: {props: {boxes: "$this->statBoxes()", active: "$statFilter"}, note: "PAKAI INI utk baris kotak statistik -- kotak = FILTER DATA (griduistandard 2b). Butuh trait App\Livewire\Concerns\HasGridStatFilter di komponen + statFilterDefs(); kotak tanpa 'filter' (Total/rupiah/rata-rata) otomatis tak bisa diklik"}
  x-grid.stat-row: {props: {count: required}, slot: "x-grid.stat-box", note: "dipakai INTERNAL oleh stat-filter-row; jangan ditulis langsung di layar baru"}
  x-grid.stat-box: {props: {tone: total, label: required, value: required, subtitle: null, action: "null (method Livewire -> kotak jadi tombol filter)", selected: false}, note: "idem: lewat stat-filter-row, bukan dipanggil sendiri"}
  x-grid.toolbar: {slot: "default = input search; named: tools, newRecord"}
  x-grid.table-shell: {slot: "<table>"}
  x-grid.identity-cell: {props: {id: required, name: required, code: null}, note: "avatar+nama+kode"}
  x-grid.action-dropdown: {props: {actions: "[[icon,label,action,tooltip]]"}}
  x-grid.action-icon: {props: {icon: "nama Font Awesome, mis. fa-pen", title: req, action: req, variant: default, confirm: null, bordered: true, active: "null; isi \$row->activate utk tombol aktif/nonaktif -> ikon+warna ditentukan komponen (fa-ban merah / fa-circle-check hijau)"}, note: "ikon WAJIB Font Awesome (fa-pen Edit, fa-up-right-from-square Buka, fa-check Confirm, fa-xmark Batal, fa-eye Lihat, fa-key Password, fa-rotate Konversi, fa-scissors Split), BUKAN karakter Unicode -- griduistandard 5"}
  x-grid.toggle-switch: {props: {on: req, action: req, confirm: null, title: null}, note: "HANYA grid Master"}
  x-grid.tickmark: {props: {on: false, action: req, title: null, disabled: false}, note: "flag biner per baris (bukan aktif/nonaktif Master)"}
  x-grid.group-header-row: {props: {label: req, value: req, colspan: req}}
  x-grid.empty-row: {props: {colspan: req, message: 'Belum ada data.'}}
  x-grid.spreadsheet-table: {props: {gridKey: req, columns: req, rows: req, newRowDefaults: req, errors: [], version: 0}, note: "spreadsheetgridstandard.md"}
  includes: # dipanggil @include, bukan tag
    - "@include('components.grid.filters-panel') + @include('components.grid.toolbar-buttons') di slot tools"
    - '@include("components.grid.filters-row", ["columnDefs" => $this->gridSearchColumnDefs()])'
    - '@include("components.grid.pagination-footer", ["paginator" => $this->items])'
    - '@include("components.grid.column-modal"|"components.grid.sort-modal", ["columnDefs" => $this->gridColumnDefs()])'

